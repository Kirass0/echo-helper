<!doctype html>
<!--
  PROTOTYPE, throwaway. Ticket: .scratch/web-rewrite/issues/08-upgrade-strategy-ux.md
  Question: what should the Upgrade Strategy screen be for someone who has never built a strategy?
  Three structurally different variants, switchable with ?variant=A|B|C, the bottom bar, or the arrow keys:
    D  Merge chosen by the owner: A, plus a "Compare with another strategy" switch into a C-like two-column view.
    A  Checkpoints: all five Tune Stages in one column, rules written as sentences, Discard Rate beside each stage.
    B  One stage at a time: a funnel stepper on top, one Tune Stage edited below, "or" as side-by-side columns.
    C  Compare: two strategies side by side with examples to start from and a difference table.
  Results are APPROXIMATE (60,000 sampled Echoes, fixed seed), not the exact Core. Styling is a neutral wireframe,
  not the visual direction (that is ticket 11). Weight tables are the unrescaled source tables, copied from prototype 07.
  Double-click to open. No persistence.
  NOT IMPLEMENTED, decided: a popup such as the Substat picker ("pick Substats") closes when the player clicks anywhere outside it.
-->

<style>

<body>
<div id="app"></div>
<pre id="state"></pre>
<div id="switcher">
  <button data-sw="-1" aria-label="Previous variant">◀</button>
  <span id="swlabel"></span>
  <button data-sw="1" aria-label="Next variant">▶</button>

<script src="tables.js"></script>
<script>
// ===== game data (from EchoHelper.Core/Echo.cs @ 53ce242, TuningCost.cs) =====
const TYPES = ['Atk_Percent','Atk_Flat','Def_Percent','Def_Flat','Hp_Percent','Hp_Flat','Basic_Attack','Skill','Heavy','Liberation','Energy_Regen','Critical_Rate','Critical_Damage'];
const NAMES = {Atk_Percent:'ATK%',Atk_Flat:'Flat ATK',Def_Percent:'DEF%',Def_Flat:'Flat DEF',Hp_Percent:'HP%',Hp_Flat:'Flat HP',Basic_Attack:'Basic Attack DMG',Skill:'Resonance Skill DMG',Heavy:'Heavy Attack DMG',Liberation:'Resonance Liberation DMG',Energy_Regen:'Energy Regen',Critical_Rate:'Crit Rate',Critical_Damage:'Crit Damage'};
const REF = {Atk_Percent:8.6,Atk_Flat:40,Def_Percent:10.9,Def_Flat:50,Hp_Percent:8.6,Hp_Flat:430,Basic_Attack:8.6,Skill:8.6,Heavy:8.6,Liberation:8.6,Energy_Regen:9.2,Critical_Rate:7.5,Critical_Damage:15};
const STD = [6.4,7.1,7.9,8.6,9.4,10.1,10.9,11.6];
const VALUES = {Critical_Rate:[6.3,6.9,7.5,8.1,8.7,9.3,9.9,10.5],Critical_Damage:[12.6,13.8,15,16.2,17.4,18.6,19.8,21],Hp_Flat:[320,360,390,430,470,510,540,580],Def_Percent:[8.1,9,10,10.9,11.8,12.8,13.8,14.7],Energy_Regen:[6.8,7.6,8.4,9.2,10,10.8,11.6,12.4],Atk_Flat:[30,30,40,40,50,50,60,60],Def_Flat:[40,40,50,50,60,60,70,70],Atk_Percent:STD,Hp_Percent:STD,Liberation:STD,Skill:STD,Heavy:STD,Basic_Attack:STD};
const TIER = [680,777,2039,2428,1748,1457,582,291], TIER_CRIT = [2333,2333,2333,800,800,800,300,300];
const tierOf = t => (t === 'Critical_Rate' || t === 'Critical_Damage') ? TIER_CRIT : TIER;
const ROLLS = {}; // merged distinct values with chances
for (const t of TYPES) { const w = tierOf(t), s = w.reduce((a,b)=>a+b), m = new Map(); VALUES[t].forEach((v,i)=>m.set(v,(m.get(v)||0)+w[i]/s)); ROLLS[t] = [...m].map(([v,p])=>({v,p})); }
const COST = [[0,0,0],[4400,10,2440],[16500,20,5650],[39600,30,9960],[79100,40,15910],[142600,50,24260]];
const stageLabel = s => `Tune Stage ${s}/5 (+${s*5})`;

// ===== model =====
const newRule = o => Object.assign({kind:'count', n:1, types:[], type:'Critical_Rate', value:6.3, score:'', chance:'', target:''}, o);
const CR = 'Critical_Rate', CD = 'Critical_Damage';
const EXAMPLES = [
  { name:'Keep every Echo', desc:'No conditions: tune every Echo to 5/5. The most expensive way, shown as a baseline.', stages:()=>[[],[],[],[],[]] },
  { name:'Crit first', desc:'Needs Crit Rate or Crit Damage by 2/5, and both by 4/5.', stages:()=>[[],[[newRule({n:1,types:[CR,CD]})]],[],[[newRule({n:2,types:[CR,CD]})]],[]] },
  // Echo Score thresholds are set as "the Echo Score of a Top x% Echo for this Weight Table" and worked out when the example is loaded (owner, 2026-11-17).
  { name:'Double crit, or one great crit roll', desc:'At 3/5: both crits, or a high Crit Rate or Crit Damage roll. At 5/5: an Echo Score of a Top 10% Echo for this Weight Table.',
    stages:()=>[[],[],[[newRule({n:2,types:[CR,CD]})],[newRule({kind:'roll',type:CR,value:9.3})],[newRule({kind:'roll',type:CD,value:18.6})]],[],[[newRule({kind:'score',score:topScore(0.10)})]]] },
  { name:'Chance to reach a Top 5% Echo', desc:'At every stage, needs a growing chance to finish with the Echo Score of a Top 5% Echo for this Weight Table.',
    stages:()=>{ const t = topScore(0.05); return [[[newRule({kind:'chance',chance:'5',target:t})]],[[newRule({kind:'chance',chance:'8',target:t})]],[[newRule({kind:'chance',chance:'12',target:t})]],[[newRule({kind:'chance',chance:'20',target:t})]],[[newRule({kind:'score',score:t})]]]; } },
];
const S = {
  variant: new URLSearchParams(location.search).get('variant') || 'D',
  table: BUILTIN[0].name,
  strat: { A:{name:'Crit first', stages:EXAMPLES[1].stages()}, B:{name:'Keep every Echo', stages:EXAMPLES[0].stages()} },
  bStage: 2,          // variant B: selected Tune Stage
  cEdit: {A:false,B:false}, // variant C: which column is in edit mode
  dCompare: new URLSearchParams(location.search).get('compare') === '1', dEdit: {A:false,B:true}, // variant D
  open: {},           // open Substat pickers, by data-path
};
const VARIANTS = { D:'Checkpoints + compare (merge)', A:'Checkpoints', B:'One stage at a time', C:'Compare two strategies' };

// ===== validation (only incomplete rules block; impossible rules are allowed, ADR 0001) =====
const num = s => (typeof s === 'string' && /^\s*-?(\d+\.?\d*|\.\d+)\s*$/.test(s)) ? parseFloat(s) : null;
function ruleProblem(r) {
  if (r.kind === 'count') return r.types.length ? null : 'Pick at least one Substat.';
  if (r.kind === 'score') return num(r.score) === null ? 'Enter an Echo Score.' : null;
  if (r.kind === 'chance') { if (num(r.chance) === null) return 'Enter a chance in %.'; if (num(r.target) === null) return 'Enter a Target Score.'; }
  return null;
}
function problems(st) { const out=[]; st.stages.forEach((gs,i)=>gs.forEach(g=>g.forEach(r=>{ const p=ruleProblem(r); if(p) out.push({stage:i+1,msg:p}); }))); return out; }

// ===== approximate calculation (sampling, fixed seed) =====
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const BW = 0.1; const finishCache = new Map();
function finishSuffix(weights, mask, k) { // P(added score >= x) table for finishing k more Substats from the missing types
  const key = S.table + '|' + mask; if (finishCache.has(key)) return finishCache.get(key);
  const missing = TYPES.map((t,i)=>i).filter(i => !(mask & (1<<i)));
  const rolls = missing.map(i => { const t = TYPES[i]; return ROLLS[t].map(({v,p}) => ({b:Math.round((weights[t]||0)*v/REF[t]/BW), p})); });
  const maxB = rolls.map(r=>Math.max(...r.map(x=>x.b))).sort((a,b)=>b-a).slice(0,k).reduce((a,b)=>a+b,0) + 1;
  const dp = Array.from({length:k+1}, () => new Float64Array(maxB+1)); dp[0][0] = 1;
  rolls.forEach((rs, idx) => { for (let j = Math.min(k, idx+1); j >= 1; j--) { const src = dp[j-1], dst = dp[j]; for (let b = 0; b <= maxB; b++) { const q = src[b]; if (!q) continue; for (const r of rs) if (b + r.b <= maxB) dst[b + r.b] += q * r.p; } } });
  let comb = 1; for (let i = 0; i < k; i++) comb = comb * (missing.length - i) / (i + 1);
  const suf = new Float64Array(maxB+2); for (let b = maxB; b >= 0; b--) suf[b] = suf[b+1] + dp[k][b] / comb;
  finishCache.set(key, suf); return suf;
}
function simulate(stages, weights) {
  const N = 60000, rand = rng(20261117);
  const compiled = stages.map(gs => gs.map(g => g.map(r => ({...r, ti:TYPES.indexOf(r.type), tis:r.types.map(t=>TYPES.indexOf(t)), sc:num(r.score), ch:num(r.chance), tg:num(r.target)}))));
  const wv = TYPES.map(t => weights[t] || 0), cum = TYPES.map(t => { const w = tierOf(t); let s = 0; return w.map(x => s += x); });
  const disc = [0,0,0,0,0,0]; let succ = 0, sum = 0, min = Infinity; const vals = new Float64Array(13);
  const passes = (r, mask, score, s) => {
    switch (r.kind) {
      case 'count': return r.tis.filter(i => mask & (1<<i)).length >= r.n;
      case 'roll': return !!(mask & (1<<r.ti)) && vals[r.ti] >= r.value - 1e-9;
      case 'score': return score >= r.sc - 1e-9;
      case 'chance': { const need = r.tg - score; let p; if (need <= 1e-9) p = 1; else if (s === 5) p = 0; else { const suf = finishSuffix(weights, mask, 5 - s); const b = Math.ceil(need/BW - 1e-9); p = b < suf.length ? suf[b] : 0; } return p >= r.ch/100 - 1e-9; }
    }
  };
  for (let n = 0; n < N; n++) {
    let mask = 0, score = 0, dead = false;
    for (let s = 1; s <= 5; s++) {
      let t; do { t = (rand()*13) | 0; } while (mask & (1<<t));
      mask |= 1<<t; const c = cum[t], x = rand()*c[7]; let tier = 0; while (x >= c[tier]) tier++;
      const v = VALUES[TYPES[t]][tier]; vals[t] = v; score += wv[t]*v/REF[TYPES[t]];
      const gs = compiled[s-1];
      if (gs.length && !gs.some(g => g.every(r => passes(r, mask, score, s)))) { disc[s]++; dead = true; break; }
    }
    if (!dead) { succ++; sum += score; if (score < min) min = score; }
  }
  const sr = succ / N, d = disc.map(x => x / N);
  let cost = null;
  if (succ) { let e = 0, tu = 0, sh = 0; for (let s = 1; s <= 5; s++) { e += d[s]*Math.floor(COST[s][0]*0.25); tu += d[s]*Math.floor(COST[s][1]*0.7); sh += d[s]*COST[s][2]; }
    e += sr*COST[5][0]; tu += sr*COST[5][1]; sh += sr*COST[5][2]; cost = {echoes:1/sr, exp:e/sr, tuners:tu/sr, shell:sh/sr}; }
  return { sr, disc:d, cost, avg: succ ? sum/succ : null, min: succ ? min : null };
}
// The Echo Score that only a share p of fully tuned Echoes beat, for the selected Weight Table (sampled), rounded to 0.1.
const topCache = new Map();
function topScore(p) {
  const w = BUILTIN.find(t => t.name === S.table).weights;
  if (!topCache.has(S.table)) { const rand = rng(7), xs = new Float64Array(60000);
    for (let n = 0; n < xs.length; n++) { let mask = 0, score = 0; for (let s = 0; s < 5; s++) { let t; do { t = (rand()*13) | 0; } while (mask & (1<<t)); mask |= 1<<t;
      const T = TYPES[t], tw = tierOf(T), tot = tw.reduce((a,b)=>a+b); let x = rand()*tot, tier = 0; while ((x -= tw[tier]) >= 0) tier++; score += (w[T]||0)*VALUES[T][tier]/REF[T]; } xs[n] = score; }
    topCache.set(S.table, xs.sort().reverse()); }
  const xs = topCache.get(S.table); return xs[Math.floor(xs.length * p)].toFixed(1);
}
const lastGood = {}, resCache = new Map();
function result(key) {
  const st = S.strat[key], probs = problems(st);
  if (probs.length) return { res: lastGood[key] || null, stale: true, probs };
  const ck = S.table + JSON.stringify(st.stages);
  if (!resCache.has(ck)) resCache.set(ck, simulate(st.stages, BUILTIN.find(t => t.name === S.table).weights));
  return { res: lastGood[key] = resCache.get(ck), stale: false, probs };
}

// ===== formatting & shared fragments =====
const pct = x => x == null ? '–' : (x > 0 && x < 0.001 ? '<0.1%' : (x*100).toFixed(1) + '%');
const int = x => Math.round(x).toLocaleString('en-US');
const f2 = x => x == null ? '–' : x.toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts = (list, cur) => list.map(([v,l]) => `<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(l)}</option>`).join('');
const KINDS = [['count','Substat Count'],['roll','Substat Roll'],['score','Echo Score'],['chance','Target Chance']];
const STAGE_COLORS = ['#f3c26b','#eaa94a','#de8f3c','#cf7433','#b85a2c'];

function ruleFields(path, r) {
  const k = `data-path="${path}"`, prob = ruleProblem(r); let body = '';
  if (r.kind === 'count') {
    const open = S.open[path] ? ' open' : '';
    const sum = r.types.length ? r.types.map(t => NAMES[t]).join(', ') : 'pick Substats';
    body = `at least <select ${k} data-f="n" data-k="${path}.n">${opts([1,2,3,4,5].map(n=>[n,n]), r.n)}</select> of
      <details class="pick"${open} ${k}><summary class="${r.types.length?'':'empty'}">${esc(sum)}</summary><div class="menu">${TYPES.map(t => `<label><input type="checkbox" ${k} data-f="types" value="${t}"${r.types.includes(t)?' checked':''}> ${NAMES[t]}</label>`).join('')}</div></details>`;
  } else if (r.kind === 'roll') {
    body = `<select ${k} data-f="type" data-k="${path}.type">${opts(TYPES.map(t=>[t,NAMES[t]]), r.type)}</select> at least
      <select ${k} data-f="value" data-k="${path}.value">${opts(ROLLS[r.type].map(x=>[x.v,x.v]), r.value)}</select>`;
  } else if (r.kind === 'score') {
    body = `at least <input class="num" inputmode="decimal" ${k} data-f="score" data-k="${path}.score" value="${esc(r.score)}">`;
  } else {
    body = `at least <input class="num" inputmode="decimal" ${k} data-f="chance" data-k="${path}.chance" value="${esc(r.chance)}">% chance to reach a Target Score of
      <input class="num" inputmode="decimal" ${k} data-f="target" data-k="${path}.target" value="${esc(r.target)}">`;
  }
  return `<select ${k} data-f="kind" data-k="${path}.kind" aria-label="Kind of rule">${opts(KINDS, r.kind)}</select> ${body}
    <button class="x" data-act="removeRule" ${k} title="Remove this rule">×</button>
    ${prob ? `<div class="problem">${prob}</div>` : ''}`;
}
function ruleText(r) {
  if (r.kind === 'count') return `at least ${r.n} of ${r.types.map(t=>NAMES[t]).join(', ') || '…'}`;
  if (r.kind === 'roll') return `${NAMES[r.type]} at least ${r.value}`;
  if (r.kind === 'score') return `Echo Score at least ${r.score || '…'}`;
  return `${r.chance || '…'}% chance to reach ${r.target || '…'}`;
}
const groupsText = gs => gs.length ? gs.map(g => g.map(ruleText).join(' and ')).join(' <span class="or">or</span> ') : '<span class="muted">every Echo keeps tuning</span>';

function header(extra = '') {
  return `<div class="proto-note">Prototype · results are approximate (60,000 sampled Echoes) · variant ${S.variant}: ${VARIANTS[S.variant]}</div>
  <header class="top"><h1>Upgrade Strategy</h1>
    <label>Substat Weight Table <select data-f="table" data-k="table">${opts(BUILTIN.map(t=>[t.name,t.name]), S.table)}</select></label>
    ${extra}</header>`;
}
const exampleSelect = key => `<label>Start from an example <select data-f="example" data-key="${key}" data-k="ex${key}"><option value="">Choose…</option>${EXAMPLES.map((e,i)=>`<option value="${i}">${esc(e.name)}</option>`).join('')}</select></label>`;
function staleMsg(r) { if (!r.probs.length) return ''; const p = r.probs[0];
  return `<div class="stale-msg">Results are from before your last change. Finish the highlighted rule at ${stageLabel(p.stage)}${r.probs.length>1?` (and ${r.probs.length-1} more)`:''} to update them.</div>`; }
function fateBar(res) {
  if (!res) return '';
  const seg = res.disc.slice(1).map((d,i) => `<span style="width:${d*100}%;background:${STAGE_COLORS[i]}" title="Discarded at ${stageLabel(i+1)}: ${pct(d)}"></span>`).join('');
  return `<div class="fate">${seg}<span style="width:${res.sr*100}%;background:var(--good)" title="Successful: ${pct(res.sr)}"></span></div>`;
}
function costTable(res) {
  if (!res) return '<p class="muted">No results yet.</p>';
  if (!res.cost) return '<p>No Echo passes every Tune Stage, so there is no cost per Successful Echo.</p>';
  const c = res.cost;
  return `<table class="cost"><tr><td>Echoes started</td><td class="n">${f2(c.echoes)}</td></tr><tr><td>Echo EXP</td><td class="n">${int(c.exp)}</td></tr>
    <tr><td>Tuners</td><td class="n">${int(c.tuners)}</td></tr><tr><td>Shell Credits</td><td class="n">${int(c.shell)}</td></tr></table>`;
}

// ===== Variant A: checkpoints =====
// The A-style stage list, used by A and by D in edit mode. No "Keep tuning if" lead (owner, 2026-11-17).
function stagesEditor(key, r) {
  const res = r.res;
  return S.strat[key].stages.map((gs, si) => {
    const s = si + 1, d = res ? res.disc[s] : 0;
    const groups = gs.map((g, gi) => `
      ${gi ? '<div class="a-orline or">or</div>' : ''}
      <div class="a-group">
        ${g.map((rule, ri) => `<div class="rule${ruleProblem(rule)?' bad':''}">${ri ? '<span class="and">and</span>' : ''}${ruleFields(`${key}.${si}.${gi}.${ri}`, rule)}</div>`).join('')}
        <button class="link" data-act="addRule" data-path="${key}.${si}.${gi}">+ and</button></div>`).join('');
    return `<section class="a-stage"><div><h2>${stageLabel(s)}</h2>
        <div class="a-disc ${r.stale?'stale':''}"><div class="bar"><span style="width:${d*100}%"></span></div><span class="small">${gs.length ? `${pct(d)} discarded here` : '<span class="muted">nothing discarded</span>'}</span></div></div>
      <div>${gs.length ? groups + `<button class="link" data-act="addGroup" data-path="${key}.${si}">+ or</button>`
        : `<p class="muted" style="margin:0">Every Echo that reaches this stage keeps tuning.</p><button class="link" data-act="addGroup" data-path="${key}.${si}">+ add a rule</button>`}</div></section>`;
  }).join('');
}
function variantA() {
  const key = 'A', r = result(key), res = r.res, stages = stagesEditor(key, r);
  return header(exampleSelect('A')) + `<div class="a-grid"><main>${stages}</main>
    <aside class="a-aside">${staleMsg(r)}<div class="${r.stale?'stale':''}">
      <div class="sr"><div class="big">${res ? pct(res.sr) : '–'}</div>Success Rate<div class="small muted">of Echoes started pass every Tune Stage and become Successful Echoes</div></div>
      ${fateBar(res)}<div class="small muted">Where Echoes end: the coloured parts are discarded, stage by stage; green are Successful Echoes.</div>
      <h3>Average cost per Successful Echo</h3>${costTable(res)}
      ${res && res.avg != null ? `<div class="small">Average Echo Score of Successful Echoes: <b>${f2(res.avg)}</b><br>Lowest Echo Score of a Successful Echo: <b>${f2(res.min)}</b></div>` : ''}
    </div></aside></div>`;
}

// ===== Variant B: one stage at a time =====
function variantB() {
  const key = 'A', st = S.strat.A, r = result(key), res = r.res, cur = S.bStage, si = cur - 1, gs = st.stages[si];
  let alive = 1;
  const steps = st.stages.map((g, i) => {
    const s = i + 1, d = res ? res.disc[s] : 0, before = alive; alive -= d;
    const n = g.reduce((a, x) => a + x.length, 0);
    return `<button class="b-step${s===cur?' on':''}" data-act="bStage" data-s="${s}"><span class="t">${stageLabel(s)}</span>
      <span class="small muted">${n ? `${n} rule${n>1?'s':''}${g.length>1?`, ${g.length} ways to pass`:''}` : 'no rules'}</span>
      <span class="small ${r.stale?'stale':''}">${g.length ? pct(d)+' discarded' : '&nbsp;'}</span>
      <span class="flow ${r.stale?'stale':''}" title="${pct(alive)} still tuning after this stage"><span class="alive" style="height:${Math.max(alive,0)*100}%"></span></span></button>`;
  }).join('') + `<div class="b-step end"><span class="t">Successful Echoes</span><span class="small muted">passed every stage</span><span class="small ${r.stale?'stale':''}"><b>${res ? pct(res.sr) : '–'}</b></span></div>`;
  const cols = gs.map((g, gi) => `${gi ? '<div class="b-or">or</div>' : ''}<div class="b-col">
      <div class="small muted">${gs.length > 1 ? `Way ${gi+1} to keep tuning: all of these` : 'Keep tuning if all of these hold'}</div>
      ${g.map((rule, ri) => `<div class="rule${ruleProblem(rule)?' bad':''}">${ruleFields(`${key}.${si}.${gi}.${ri}`, rule)}</div>`).join('')}
      <button class="link" data-act="addRule" data-path="${key}.${si}.${gi}">+ add a rule here</button></div>`).join('');
  return header(exampleSelect('A')) + `<nav class="b-steps" aria-label="Tune Stages">${steps}</nav>
    <section class="b-editor"><h2>${stageLabel(cur)}</h2>
      <p class="muted small" style="margin:0">${gs.length > 1 ? 'An Echo keeps tuning if it passes any one of the boxes below. Inside a box, every rule must hold.' : gs.length ? 'An Echo that fails these rules is discarded here.' : 'No rules: every Echo that reaches this stage keeps tuning.'}</p>
      <div class="b-cols">${cols}<button class="b-addcol" data-act="addGroup" data-path="${key}.${si}">${gs.length ? '+ or another way to pass' : '+ add a rule for this stage'}</button></div>
      <div class="b-nav"><button data-act="bStage" data-s="${Math.max(1,cur-1)}" ${cur===1?'disabled':''}>◀ ${cur>1?stageLabel(cur-1):''}</button><button data-act="bStage" data-s="${Math.min(5,cur+1)}" ${cur===5?'disabled':''}>${cur<5?stageLabel(cur+1):''} ▶</button></div>
    </section>
    <footer class="b-bar">${r.probs.length ? staleMsg(r) : ''}<span class="${r.stale?'stale':''}"><span class="big">${res ? pct(res.sr) : '–'}</span> Success Rate</span>
      ${res && res.cost ? `<span class="${r.stale?'stale':''}">Per Successful Echo: <b>${f2(res.cost.echoes)}</b> Echoes started · <b>${int(res.cost.exp)}</b> Echo EXP · <b>${int(res.cost.tuners)}</b> Tuners · <b>${int(res.cost.shell)}</b> Shell Credits</span>` : res ? '<span>No Successful Echoes</span>' : ''}
      ${res && res.avg != null ? `<span class="small muted ${r.stale?'stale':''}">Average Echo Score ${f2(res.avg)} · lowest ${f2(res.min)}</span>` : ''}</footer>`;
}

// ===== Variant C: compare =====
function editorFor(key) { // compact editing for a column: the A-style stage list without the side panel
  return S.strat[key].stages.map((gs, si) => `<div class="c-line"><b>${stageLabel(si+1)}</b>
    ${gs.map((g, gi) => `${gi?'<div class="or">or</div>':''}<div class="a-group">${g.map((rule, ri) => `<div class="rule${ruleProblem(rule)?' bad':''}">${ri?'<span class="and">and</span>':''}${ruleFields(`${key}.${si}.${gi}.${ri}`, rule)}</div>`).join('')}
      <button class="link" data-act="addRule" data-path="${key}.${si}.${gi}">+ and</button></div>`).join('')}
    <button class="link" data-act="addGroup" data-path="${key}.${si}">${gs.length ? '+ or' : '+ add a rule'}</button></div>`).join('');
}
function variantC() {
  const rA = result('A'), rB = result('B');
  const col = (key, r) => { const st = S.strat[key];
    return `<div class="c-col"><h2><span>Strategy ${key}: ${esc(st.name)}</span><button data-act="cEdit" data-key="${key}">${S.cEdit[key] ? 'Done' : 'Edit'}</button></h2>
      ${S.cEdit[key] ? editorFor(key) : st.stages.map((gs, si) => `<div class="c-line"><b>${stageLabel(si+1)}</b> ${groupsText(gs)}</div>`).join('')}
      ${staleMsg(r)}</div>`; };
  return header() + `<div class="c-wrap">
    <div class="small muted">Start from an example, then change it. Put two strategies side by side to see which costs less for the Echoes you get.</div>
    <div class="c-examples">${EXAMPLES.map((e, i) => `<div class="c-ex"><b>${esc(e.name)}</b><span class="small muted">${esc(e.desc)}</span>
      <span class="btns"><button data-act="loadEx" data-key="A" data-i="${i}">Use as A</button><button data-act="loadEx" data-key="B" data-i="${i}">Use as B</button></span></div>`).join('')}</div>
    <div class="c-cols">${col('A', rA)}${col('B', rB)}</div>
    <div style="margin-top:8px"><button data-act="copyAB">Copy A into B</button> <button data-act="swap">Swap A and B</button></div>
    ${compareBlock(rA, rB)}
  </div>`;
}

function compareBlock(rA, rB) {
  const A = rA.res, B = rB.res;
  const row = (label, a, b, fmt, lowerIsBetter) => {
    let diff = '';
    if (a != null && b != null && Math.abs(b - a) > 1e-12) { const better = lowerIsBetter ? b < a : b > a; diff = `<span class="${better?'better':'worse'}">${b > a ? '+' : '−'}${fmt(Math.abs(b-a))}</span>`; }
    return `<tr><td>${label}</td><td>${a == null ? '–' : fmt(a)}</td><td>${b == null ? '–' : fmt(b)}</td><td>${diff}</td></tr>`; };
  const cost = (res, f) => res && res.cost ? res.cost[f] : null;
  const maxD = Math.max(0.05, ...[A, B].filter(Boolean).flatMap(x => [...x.disc.slice(1), x.sr]));
  const bars = [1,2,3,4,5,6].map(s => { const a = A ? (s<6 ? A.disc[s] : A.sr) : 0, b = B ? (s<6 ? B.disc[s] : B.sr) : 0;
    return `<div class="pair"><span style="height:${a/maxD*100}%;background:var(--accent)" title="A: ${pct(a)}"></span><span style="height:${b/maxD*100}%;background:#9aa7b8" title="B: ${pct(b)}"></span></div>`; }).join('');
  return `    <table class="cmp"><tr><th></th><th>A</th><th>B</th><th>B compared with A</th></tr>
      ${row('Success Rate', A && A.sr, B && B.sr, pct, false)}
      ${row('Echoes started per Successful Echo', cost(A,'echoes'), cost(B,'echoes'), f2, true)}
      ${row('Echo EXP per Successful Echo', cost(A,'exp'), cost(B,'exp'), int, true)}
      ${row('Tuners per Successful Echo', cost(A,'tuners'), cost(B,'tuners'), int, true)}
      ${row('Shell Credits per Successful Echo', cost(A,'shell'), cost(B,'shell'), int, true)}
      ${row('Average Echo Score of Successful Echoes', A && A.avg, B && B.avg, f2, false)}
      ${row('Lowest Echo Score of a Successful Echo', A && A.min, B && B.min, f2, false)}</table>
    <div class="small muted" style="margin-bottom:4px">Where Echoes end: discarded at each Tune Stage, then Successful (<span style="color:var(--accent)">■ A</span> <span style="color:#9aa7b8">■ B</span>)</div>
    <div class="c-bars">${bars}</div><div class="c-labels">${[1,2,3,4,5].map(s=>`<span>${s}/5 (+${s*5})</span>`).join('')}<span>Successful</span></div>`;
}

// ===== Variant D: A, with a switch into a C-like comparison (owner's merge, 2026-11-17) =====
function variantD() {
  if (!S.dCompare) return variantA().replace(/(Start from an example <select[^]*?<\/select><\/label>)/, '$1 <button data-act="dCompare">Compare with another strategy</button>');
  const rA = result('A'), rB = result('B');
  const col = (key, r) => `<div class="c-col"><h2><span>Strategy ${key}</span><button data-act="dEdit" data-key="${key}">${S.dEdit[key] ? 'Done' : 'Edit'}</button></h2>
      <div style="margin-bottom:6px">${exampleSelect(key)}</div>
      ${S.dEdit[key] ? `<div class="d-edit">${stagesEditor(key, r)}</div>` : S.strat[key].stages.map((gs, si) => `<div class="c-line"><b>${stageLabel(si+1)}</b> ${groupsText(gs)}</div>`).join('')}
      ${staleMsg(r)}</div>`;
  return header('<button data-act="dSingle">Stop comparing</button>') + `<div class="c-wrap"><div class="c-cols">${col('A', rA)}${col('B', rB)}</div>
    ${compareBlock(rA, rB)}</div>`;
}

// ===== render, keeping focus across re-renders =====
function render() {
  const a = document.activeElement, fk = a && a.dataset && a.dataset.k, sel = a && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
  document.getElementById('app').innerHTML = ({A:variantA, B:variantB, C:variantC, D:variantD}[S.variant] || variantD)();
  document.getElementById('swlabel').textContent = `${S.variant} (${VARIANTS[S.variant]})`;
  document.getElementById('state').textContent = JSON.stringify({variant:S.variant, table:S.table, strategies:S.strat, results:{A:result('A'), B:result('B')}}, (k,v) => typeof v === 'number' ? Math.round(v*10000)/10000 : v, 2);
  if (fk) { const el = document.querySelector(`[data-k="${CSS.escape(fk)}"]`); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch {} } }
}
const ruleAt = p => { const [k, s, g, r] = p.split('.'); return S.strat[k].stages[+s][+g][+r]; };
let timer;
function edit(e) {
  const el = e.target, f = el.dataset.f; if (!f) return;
  if (f === 'table') { S.table = el.value; }
  else if (f === 'example') { if (el.value === '') return; const ex = EXAMPLES[+el.value]; S.strat[el.dataset.key] = { name: ex.name, stages: ex.stages() }; }
  else {
    const r = ruleAt(el.dataset.path);
    if (f === 'kind') r.kind = el.value;
    else if (f === 'n') r.n = +el.value;
    else if (f === 'type') { r.type = el.value; r.value = ROLLS[r.type][0].v; }
    else if (f === 'value') r.value = +el.value;
    else if (f === 'types') r.types = el.checked ? TYPES.filter(t => r.types.includes(t) || t === el.value) : r.types.filter(t => t !== el.value);
    else r[f] = el.value;
  }
  if (e.type === 'input' && el.tagName === 'INPUT' && el.type !== 'checkbox') { clearTimeout(timer); timer = setTimeout(render, 350); } else render();
}
document.addEventListener('input', edit);
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox') return; edit(e); });
document.addEventListener('toggle', e => { const p = e.target.dataset && e.target.dataset.path; if (p) S.open[p] = e.target.open; }, true);
document.addEventListener('click', e => {
  const sw = e.target.closest('[data-sw]');
  if (sw) { const v = sw.dataset.sw; if (v === 'state') { const s = document.getElementById('state'); s.style.display = s.style.display === 'block' ? 'none' : 'block'; } else cycle(+v); return; }
  const b = e.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act, p = b.dataset.path;
  if (act === 'addRule') { const [k, s, g] = p.split('.'); S.strat[k].stages[+s][+g].push(newRule()); }
  else if (act === 'addGroup') { const [k, s] = p.split('.'); S.strat[k].stages[+s].push([newRule()]); }
  else if (act === 'removeRule') { const [k, s, g, r] = p.split('.'); const gs = S.strat[k].stages[+s]; gs[+g].splice(+r, 1); if (!gs[+g].length) gs.splice(+g, 1); S.open = {}; }
  else if (act === 'bStage') S.bStage = +b.dataset.s;
  else if (act === 'dCompare') { S.dCompare = true; S.dEdit = {A:false, B:true}; S.strat.B = { name:'', stages:[[],[],[],[],[]] }; }
  else if (act === 'dSingle') S.dCompare = false;
  else if (act === 'dEdit') S.dEdit[b.dataset.key] = !S.dEdit[b.dataset.key];
  else if (act === 'cEdit') S.cEdit[b.dataset.key] = !S.cEdit[b.dataset.key];
  else if (act === 'loadEx') { const ex = EXAMPLES[+b.dataset.i]; S.strat[b.dataset.key] = { name: ex.name, stages: ex.stages() }; }
  else if (act === 'copyAB') S.strat.B = { name: S.strat.A.name + ' (copy)', stages: JSON.parse(JSON.stringify(S.strat.A.stages)) };
  else if (act === 'swap') [S.strat.A, S.strat.B] = [S.strat.B, S.strat.A];
  render();
});
function cycle(d) { const ks = Object.keys(VARIANTS); S.variant = ks[(ks.indexOf(S.variant) + d + ks.length) % ks.length];
  const u = new URL(location); u.searchParams.set('variant', S.variant); history.replaceState(null, '', u); S.open = {}; render(); }
document.addEventListener('keydown', e => { if (e.target.closest('input, select, textarea, [contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
render();
</script>
</body>
</html>
