<!doctype html>
<!--
  PROTOTYPE, throwaway. Ticket: The visual direction (.scratch/web-rewrite/issues/11-visual-direction.md)
  Question: what does the app look like? The layouts are settled (variant D of tickets 07 and 08); only the look varies.
  Three visual directions, each in a light and a dark theme, switched by ?variant=A|B|C&theme=light|dark,
  the bar at the bottom, or the arrow keys:
    A  Daylight   light first, Atkinson Hyperlegible, airy, distribution as a filled area, text buttons instead of the cog
    B  Console    dark first, Barlow (semi condensed for labels and numbers), compact, distribution as columns, icon buttons
    C  Tide       follows the system theme, Onest, soft tinted panels, distribution as a line, one colour per Tune Stage
    D  Chosen     the owner's pick (2026-11-20): A, with C's font (Onest), C's Tune Stage colours and gold Successful, C's pills
                  in the comparison, B's icons for Weights / Change and an icon remove button, dark by default, no labels on
                  the chart's target lines. The About side panel replaces the links on top in every variant.
  The bar also switches the screen state (empty / 2/5 / picking a Substat / 5/5; one strategy / compare / unfinished rule).
  Mostly read-only: tabs, focusing a table row, Change and Weights buttons, tooltips and the dialog work; rule fields do not.
  Echo Evaluation numbers are exact (07's enumeration, 0.01 buckets); strategy results are sampled (08's method).
  Tooltip and prompt texts are placeholders: the wording is ticket 17. Fonts load from Google Fonts here; the app would self-host.
-->

/* ================= shared structure (the settled layout) ================= */
* { box-sizing:border-box; }
html { color-scheme:light; } body.dark { color-scheme:dark; }
body { margin:0; font:var(--fs)/1.5 var(--font); color:var(--ink); background:var(--bg); padding-bottom:90px; font-variant-numeric:tabular-nums; }
button, select, input { font:inherit; color:inherit; }
h1, h2, h3 { font-family:var(--font-head); line-height:1.25; }
a { color:var(--acc); }
:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.mute { color:var(--mute); } .small { font-size:.86em; }
.wrap { max-width:1220px; margin:0 auto; padding:0 var(--pad); }

header.top { background:var(--panel); border-bottom:1px solid var(--line); }
header.top .wrap { display:flex; align-items:stretch; gap:28px; }
.brand { font-family:var(--font-head); font-weight:700; font-size:1.12em; padding:14px 0; }
nav.tabs { display:flex; gap:4px; }
nav.tabs a { display:flex; align-items:center; padding:0 12px; color:var(--mute); text-decoration:none; border-bottom:3px solid transparent; }
nav.tabs a:hover { color:var(--ink); }
nav.tabs a.on { color:var(--ink); border-bottom-color:var(--acc); font-weight:600; }
.purpose { padding:12px 0 0; color:var(--mute); }
main { padding:var(--gap) 0; }

.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:var(--pad); }
section > .panel + .panel { margin-top:var(--gap); }
.panel > h2:first-child, .panel > h3:first-child { margin-top:0; }
h2 { font-size:1.15em; margin:0 0 10px; } h3 { font-size:1em; margin:0 0 8px; }
.tag { font-size:.72em; font-weight:600; padding:1px 7px; border-radius:99px; background:var(--acc-soft); color:var(--acc); margin-left:8px; vertical-align:middle; font-family:var(--font); }

.tip { text-decoration:underline dotted; text-decoration-color:var(--mute); text-underline-offset:3px; cursor:help; }
#tipbox { position:fixed; z-index:40; max-width:min(290px, calc(100vw - 20px)); background:var(--ink); color:var(--bg); padding:8px 11px; border-radius:var(--radius-s); font-size:.88em; line-height:1.4; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.18); }

button.tbtn { border:none; background:none; color:var(--acc); padding:2px 6px; cursor:pointer; }
button.tbtn:hover { text-decoration:underline; }
button.x { border:none; background:none; color:var(--mute); cursor:pointer; padding:2px 6px; font-size:1.25em; line-height:1; }
button.x:hover { color:var(--bad); }
button.ibtn { border:1px solid transparent; background:none; color:var(--mute); cursor:pointer; padding:4px; border-radius:var(--radius-s); display:inline-flex; }

button.ibtn:hover { color:var(--acc); border-color:var(--line); background:var(--panel2); }
button.ibtn svg { width:16px; height:16px; }
button.chip { border:1px solid var(--line); background:var(--panel2); color:var(--ink); cursor:pointer; padding:1px 10px; border-radius:99px; font-size:.84em; }
button.chip:hover { border-color:var(--acc); color:var(--acc); }

/* ----- Echo Evaluation ----- */
.ee { display:grid; grid-template-columns:330px minmax(0,1fr); gap:var(--gap); align-items:start; }
.stage-now { font-family:var(--font-num); font-weight:600; margin:0 0 10px; }
.slot { display:flex; align-items:center; gap:8px; min-height:46px; padding:6px 10px; border:1px solid var(--line); border-radius:var(--radius-s); margin-bottom:var(--row); }
.slot .lvl { font-family:var(--font-num); color:var(--mute); font-size:.86em; width:2.4em; }
.slot .sn { flex:1; line-height:1.25; }
.slot button.tbtn, .slot button.chip { font-size:.84em; } .slot .sv { font-family:var(--font-num); font-weight:700; }
.slot.open { border-style:dashed; color:var(--mute); }
.slot.next { border-color:var(--acc); color:var(--acc); cursor:pointer; }

.slot.picking { display:block; border-color:var(--acc); padding:10px; }
.typegrid { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin:8px 0; }
.typegrid button { text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-s); padding:5px 8px; cursor:pointer; font-size:.9em; }
.typegrid button:hover { border-color:var(--acc); }

.boxes { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:var(--row); }

.box.wide { grid-column:span 3; }
.box .lab { font-size:.84em; color:var(--mute); }
.box .val { font-family:var(--font-num); font-weight:700; font-size:1.3em; line-height:1.25; }
.box.wide .val { font-size:var(--big); }
.box .why { font-size:.84em; color:var(--mute); }
.box .val.none { color:var(--mute); font-weight:400; }
.good { color:var(--good); } .bad { color:var(--bad); }
.chart-head { display:flex; justify-content:space-between; align-items:baseline; margin:var(--gap) 0 4px; gap:10px; flex-wrap:wrap; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:.84em; color:var(--mute); }
.legend i { display:inline-block; width:18px; height:0; border-top:3px solid; vertical-align:middle; margin-right:5px; }
.legend i.focus { border-color:var(--acc); } .legend i.other { border-color:var(--other); }
.legend i.tgt { border-top:2px dashed var(--ink); } .legend i.ert { border-top:2px dotted var(--er); }
svg.dist { width:100%; height:auto; display:block; overflow:visible; }
svg .ax { fill:var(--mute); font:11px var(--font-num); }
svg .grid { stroke:var(--line); stroke-width:1; }
svg .s-other { fill:none; stroke:var(--other); stroke-width:1.5; }
svg .s-focus { fill:none; stroke:var(--acc); stroke-width:2.2; stroke-linejoin:round; }
svg .s-fill { fill:var(--acc); opacity:.18; }
svg .s-bar { fill:var(--acc); }
svg .tgt { stroke:var(--ink); stroke-width:1.5; stroke-dasharray:6 4; }
svg .ert { stroke:var(--er); stroke-width:2; stroke-dasharray:1.5 4; stroke-linecap:round; }
svg .tlab { font:11px var(--font-num); fill:var(--ink); } svg .elab { font:11px var(--font-num); fill:var(--er); }
.done-note { margin:var(--gap) 0 0; color:var(--mute); }
.empty { border:1px dashed var(--line); border-radius:var(--radius); padding:28px; text-align:center; color:var(--mute); }
.empty b { color:var(--ink); display:block; margin-bottom:4px; font-size:1.05em; }

.scrollx { overflow-x:auto; }
table.list { border-collapse:collapse; width:100%; }
table.list th { font-weight:600; font-size:.84em; color:var(--mute); text-align:right; padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:bottom; line-height:1.25; }
table.list td { padding:var(--row) 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; font-family:var(--font-num); }
table.list th:first-child, table.list td:first-child { text-align:left; }
table.list tr.row { cursor:pointer; }
table.list tr.row:hover td { background:color-mix(in srgb, var(--acc-soft) 50%, transparent); }
table.list tr.row.focus td { background:var(--acc-soft); }
table.list tr.row.focus td:first-child { box-shadow:inset 3px 0 0 var(--acc); }
table.list select { max-width:190px; font-family:var(--font); }
table.list input.num { width:4.4em; }
table.list td:last-child { padding-left:2px; padding-right:0; }
table.list button.tbtn, table.list button.chip { font-size:.84em; }
.addrow { margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

/* ----- Upgrade Strategy ----- */
.us-head { display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; margin-bottom:var(--gap); }
.us-head label { display:flex; gap:8px; align-items:center; }
.us { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:var(--gap); align-items:start; }
.stage { display:grid; grid-template-columns:180px minmax(0,1fr); gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
.stage:first-child { padding-top:0; } .stage:last-child { border-bottom:none; padding-bottom:0; }
.stage h3 { font-family:var(--font-num); margin:0 0 6px; }
.dbar { height:7px; background:var(--panel2); border-radius:99px; overflow:hidden; margin:6px 0 3px; }
.dbar span { display:block; height:100%; border-radius:99px; }
.group { border-left:3px solid var(--line); padding:2px 0 4px 12px; }
.rule { display:flex; flex-wrap:wrap; align-items:center; gap:5px 7px; padding:4px 0; }
.rule.unfinished { background:var(--bad-soft); box-shadow:0 0 0 1px var(--bad); border-radius:var(--radius-s); padding:6px 8px; margin:2px 0; }
.rule .problem { flex-basis:100%; color:var(--bad); font-size:.86em; }
.pick { border:1px solid var(--line); border-radius:var(--radius-s); padding:3px 9px; background:var(--panel); }
.and, .or { font-weight:600; color:var(--mute); font-size:.84em; }
.or { margin:6px 0 6px 2px; display:block; }
.res { position:sticky; top:12px; }
.res .big { font-family:var(--font-num); font-size:calc(var(--big) + 6px); font-weight:700; line-height:1.1; }
.fate { display:flex; height:16px; border-radius:var(--radius-s); overflow:hidden; background:var(--panel2); margin:12px 0 6px; }
.fate span { display:block; height:100%; }
.fate-key { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.8em; color:var(--mute); }
.fate-key i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
table.cost { border-collapse:collapse; width:100%; margin:4px 0 12px; }
table.cost td { padding:3px 0; } table.cost td.n { text-align:right; font-family:var(--font-num); }
.res h3 { margin:var(--gap) 0 4px; font-size:.95em; }
.stale-wrap { opacity:.42; }
.stale-msg { color:var(--bad); font-size:.88em; margin:0 0 10px; padding:8px 10px; background:var(--bad-soft); border-radius:var(--radius-s); }

.cols { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
.col h2 { display:flex; justify-content:space-between; align-items:center; }
.sumline { display:grid; grid-template-columns:150px 1fr; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
.sumline:last-child { border-bottom:none; }
.sumline b { font-family:var(--font-num); font-weight:600; }
.col .stage { grid-template-columns:1fr; gap:4px; }
table.cmp { border-collapse:collapse; width:100%; }
table.cmp th, table.cmp td { text-align:right; padding:7px 10px; border-bottom:1px solid var(--line); font-family:var(--font-num); }
table.cmp th { font-size:.84em; color:var(--mute); font-weight:600; }
table.cmp th:first-child, table.cmp td:first-child { text-align:left; font-family:var(--font); }
.better { color:var(--good); font-weight:600; } .worse { color:var(--bad); font-weight:600; }
.pairs { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; align-items:end; height:150px; border-bottom:1px solid var(--line); margin-top:8px; }
.pairs .p { display:flex; gap:3px; align-items:flex-end; justify-content:center; height:100%; }
.pairs .p span { width:24px; border-radius:var(--radius-s) var(--radius-s) 0 0; min-height:1px; }
.pair-lab { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; text-align:center; font-size:.78em; color:var(--mute); margin-top:4px; font-family:var(--font-num); }

/* ----- About ----- */
.about-grid { display:grid; grid-template-columns:220px minmax(0,1fr); gap:calc(var(--gap) * 2); align-items:start; }
.about { max-width:68ch; }
.toc-side { position:sticky; top:16px; display:flex; flex-direction:column; border-left:2px solid var(--line); }
.toc-side a { color:var(--mute); text-decoration:none; padding:6px 0 6px 14px; margin-left:-2px; border-left:2px solid transparent; }
.toc-side a:hover { color:var(--ink); }
.toc-side a.on { color:var(--ink); border-left-color:var(--acc); font-weight:600; }
@media (max-width: 820px) { .about-grid { grid-template-columns:1fr; } .toc-side { position:static; } }
.about section { padding:6px 0 18px; border-bottom:1px solid var(--line); }
.about h2 { margin-top:16px; }
.about p, .about li { line-height:1.6; }
.about table { border-collapse:collapse; font-family:var(--font-num); }
.about td, .about th { padding:3px 18px 3px 0; text-align:left; border-bottom:1px solid var(--line); }
.toc { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.92em; }

/* ----- dialog ----- */
.scrim { position:fixed; inset:0; background:rgba(10,15,25,.45); display:flex; align-items:center; justify-content:center; z-index:30; padding:14px; }
.dialog { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:var(--pad); width:min(460px,100%); max-height:90vh; overflow:auto; box-shadow:0 18px 50px rgba(0,0,0,.3); }
.wt { display:grid; grid-template-columns:1fr 3.2em 90px; gap:6px 10px; align-items:center; margin:12px 0; font-size:.92em; }
.wt .n { text-align:right; font-family:var(--font-num); }
.wt .b { height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; } .wt .b span { display:block; height:100%; background:var(--acc); }
.wt .z { color:var(--mute); }
.dlg-btns { display:flex; gap:8px; justify-content:flex-end; }

/* ================= what each direction changes beyond tokens ================= */
/* A: airy, bordered panels, big quiet numbers */
body.vA .box .val { font-weight:700; }
/* B: compact, flat, a line under each panel title, labels set condensed */
body.vB header.top { background:var(--bg); }

<script>
// ================= game data (EchoHelper.Core/Echo.cs @ 53ce242, TuningCost.cs) =================
const TIER = [680, 777, 2039, 2428, 1748, 1457, 582, 291], TIER_CRIT = [2333, 2333, 2333, 800, 800, 800, 300, 300];
const STD = [6.4,7.1,7.9,8.6,9.4,10.1,10.9,11.6];
const TYPES = [
  ['Critical_Rate','Crit Rate',[6.3,6.9,7.5,8.1,8.7,9.3,9.9,10.5],true],
  ['Critical_Damage','Crit Damage',[12.6,13.8,15,16.2,17.4,18.6,19.8,21],true],
  ['Atk_Percent','ATK%',STD,true], ['Atk_Flat','Flat ATK',[30,30,40,40,50,50,60,60],false],
  ['Hp_Percent','HP%',STD,true], ['Hp_Flat','Flat HP',[320,360,390,430,470,510,540,580],false],
  ['Def_Percent','DEF%',[8.1,9,10,10.9,11.8,12.8,13.8,14.7],true], ['Def_Flat','Flat DEF',[40,40,50,50,60,60,70,70],false],
  ['Energy_Regen','Energy Regen',[6.8,7.6,8.4,9.2,10,10.8,11.6,12.4],true],
  ['Basic_Attack','Basic Attack DMG Bonus',STD,true], ['Heavy','Heavy Attack DMG Bonus',STD,true],
  ['Skill','Resonance Skill DMG Bonus',STD,true], ['Liberation','Resonance Liberation DMG Bonus',STD,true],
].map(([key, name, tiers, pct]) => {
  const crit = key === 'Critical_Rate' || key === 'Critical_Damage', w = crit ? TIER_CRIT : TIER, sum = w.reduce((a, b) => a + b);
  const rolls = []; tiers.forEach((v, i) => { const r = rolls.find(r => r.v === v); if (r) r.p += w[i] / sum; else rolls.push({ v, p: w[i] / sum }); });
  let c = 0; const ref = rolls.find(r => (c += r.p) >= 0.5 - 1e-12).v; // Reference Roll: chance-weighted median

const T = Object.fromEntries(TYPES.map(t => [t.key, t])), KEYS = TYPES.map(t => t.key);
const fmtRoll = (k, v) => T[k].pct ? v + '%' : String(v);
const COST = [[0,0,0],[4400,10,2440],[16500,20,5650],[39600,30,9960],[79100,40,15910],[142600,50,24260]];

// ================= Echo Evaluation calculation (exact, from prototype 07) =================
const binom = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
const scoreOf = (k, v, tbl) => (tbl.weights[k] || 0) * v / T[k].ref;
const echoScore = (echo, tbl) => echo.reduce((a, s) => a + scoreOf(s.type, s.value, tbl), 0);
const cache = new Map();
function finishes(echo, tbl) {
  const ck = tbl.name + '|' + echo.map(s => s.type + s.value).join(',');
  if (cache.has(ck)) return cache.get(ck);
  const used = new Set(echo.map(s => s.type)), unused = TYPES.filter(t => !used.has(t.key)), k = 5 - echo.length;
  const dp = Array.from({ length: k + 1 }, () => new Map()); dp[0].set(used.has('Energy_Regen') ? 1 : 0, 1);
  for (const t of unused) {
    const rolls = new Map(); for (const r of t.rolls) { const rk = Math.round(scoreOf(t.key, r.v, tbl) * 100); rolls.set(rk, (rolls.get(rk) || 0) + r.p); }
    const isEr = t.key === 'Energy_Regen' ? 1 : 0;
    for (let j = k - 1; j >= 0; j--) for (const [key, p] of dp[j]) { const er = key & 1, s = (key - er) / 2;
      for (const [rk, rp] of rolls) { const nk = (s + rk) * 2 + (er | isEr); dp[j + 1].set(nk, (dp[j + 1].get(nk) || 0) + p * rp); } }
  }
  const base = echoScore(echo, tbl), total = binom(unused.length, k);

  cache.set(ck, out); return out;
}
const num = s => (s === '' || s == null || !isFinite(+s)) ? null : +s;
function evaluate(echo, row) {
  const tbl = tableByName(row.name), cur = echoScore(echo, tbl), fresh = finishes([], tbl), hasEr = echo.some(s => s.type === 'Energy_Regen');
  const tgt = num(row.target), ert = num(row.erTarget), r = { tbl, cur, hasEr, tgt, ert, full: echo.length === 5 };
  if (cur > 0) { r.top = fresh.filter(f => f.score > cur + 0.005).reduce((a, f) => a + f.p, 0); if (hasEr) r.erTop = fresh.filter(f => f.er && f.score > cur + 0.005).reduce((a, f) => a + f.p, 0); }
  if (r.full) { if (tgt != null) r.reaches = cur >= tgt - 1e-9; if (ert != null && hasEr) r.reachesEr = cur >= ert - 1e-9; return r; }
  const d = finishes(echo, tbl); r.dist = d; r.best = d[d.length - 1].score; r.worst = d[0].score; r.avg = d.reduce((a, f) => a + f.p * f.score, 0);

  if (ert != null) r.erChance = d.filter(f => f.er && f.score >= ert - 1e-9).reduce((a, f) => a + f.p, 0);

function topScore(tbl, p) { const d = finishes([], tbl); let c = 0; for (let i = d.length - 1; i >= 0; i--) { c += d[i].p; if (c >= p) return +d[i].score.toFixed(1); } return 0; }

// ================= Upgrade Strategy calculation (sampled, from prototype 08) =================
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const simCache = new Map();
function simulate(stages, w) {
  const ck = JSON.stringify(stages) + JSON.stringify(w); if (simCache.has(ck)) return simCache.get(ck);
  const N = 60000, rand = rng(20261117);
  const comp = stages.map(gs => gs.map(g => g.map(r => ({ ...r, ti: KEYS.indexOf(r.type), tis: (r.types || []).map(t => KEYS.indexOf(t)), sc: num(r.score) }))));
  const wv = TYPES.map(t => w[t.key] || 0), cum = TYPES.map(t => { let s = 0; return (t.crit ? TIER_CRIT : TIER).map(x => s += x); });
  const disc = [0,0,0,0,0,0]; let succ = 0, sum = 0, min = Infinity; const vals = new Float64Array(13);
  const passes = (r, mask, score) => r.kind === 'count' ? r.tis.filter(i => mask & (1 << i)).length >= r.n
    : r.kind === 'roll' ? !!(mask & (1 << r.ti)) && vals[r.ti] >= r.value - 1e-9 : score >= r.sc - 1e-9;
  for (let n = 0; n < N; n++) {
    let mask = 0, score = 0, dead = false;
    for (let s = 1; s <= 5; s++) {
      let t; do { t = (rand() * 13) | 0; } while (mask & (1 << t));
      mask |= 1 << t; const c = cum[t], x = rand() * c[7]; let tier = 0; while (x >= c[tier]) tier++;
      const v = TYPES[t].tiers[tier]; vals[t] = v; score += wv[t] * v / TYPES[t].ref;
      const gs = comp[s - 1];

    }

  }

  if (succ) { let e = 0, tu = 0, sh = 0; for (let s = 1; s <= 5; s++) { e += d[s] * Math.floor(COST[s][0] * 0.25); tu += d[s] * Math.floor(COST[s][1] * 0.7); sh += d[s] * COST[s][2]; }
    e += sr * COST[5][0]; tu += sr * COST[5][1]; sh += sr * COST[5][2]; cost = { echoes: 1 / sr, exp: e / sr, tuners: tu / sr, shell: sh / sr }; }
  const out = { sr, disc: d, cost, avg: succ ? sum / succ : null, min: succ ? min : null }; simCache.set(ck, out); return out;
}

// ================= placeholder texts (wording is ticket 17) =================
const TIP = {
  table: 'How much each Substat is worth to one Resonator. The same Echo scores differently for each table.',
  score: 'The Echo\'s Substats added up by their weights in this table. Higher is better for this Resonator.',
  target: 'The Echo Score you want this Echo to have once it is fully tuned.',
  erTarget: 'A separate, usually lower Target Score for Echoes that roll Energy Regen.',
  chance: 'The chance that this Echo reaches your Target Score once fully tuned.',
  erChance: 'The chance that this Echo ends up with Energy Regen and reaches your ER Target Score.',
  top: 'The share of fully tuned Echoes with a higher Echo Score than this one.',
  erTop: 'The same, counting only fully tuned Echoes that have Energy Regen.',
  median: 'Half of the ways this Echo can finish score above this, half below.',
  band: 'The Echo Score range is cut into 60 equal bands. Each point is the chance of finishing in that band.',
  discard: 'The share of all Echoes started that are discarded at this Tune Stage.',
  success: 'The share of Echoes started that pass every Tune Stage.',

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const sc = v => v == null ? '—' : v.toFixed(2);
const int = x => Math.round(x).toLocaleString('en-US');
const stageText = n => `Tune Stage ${n}/5 (+${n * 5})`;

// ================= directions =================
const VARIANTS = {
  A: { name: 'Daylight', theme: 'light', chart: 'area', actions: 'text' },
  B: { name: 'Console', theme: 'dark', chart: 'bars', actions: 'icon' },
  C: { name: 'Tide', theme: 'system', chart: 'line', actions: 'chip' },
  D: { name: 'Chosen', theme: 'dark', chart: 'area', actions: 'icon', iconRemove: true, noChartLabels: true },
};
const ICON = {
  change: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/></svg>',
  remove: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  weights: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h7M13 4h1M2 8h2M8 8h6M2 12h8M14 12h0"/><circle cx="11" cy="4" r="1.7"/><circle cx="6" cy="8" r="1.7"/><circle cx="12" cy="12" r="1.7"/></svg>',
};
let V;
const removeBtn = label => V.iconRemove ? `<button class="ibtn rm" aria-label="${esc(label)}" title="${esc(label)}">${ICON.remove}</button>` : `<button class="x" aria-label="${esc(label)}">×</button>`;
function action(kind, label, attrs) {
  if (V.actions === 'icon') return `<button class="ibtn" ${attrs} aria-label="${esc(label)}" title="${esc(label)}">${ICON[kind]}</button>`;
  const text = kind === 'change' ? 'Change' : 'Weights';
  return `<button class="${V.actions === 'chip' ? 'chip' : 'tbtn'}" ${attrs} aria-label="${esc(label)}">${text}</button>`;

// ================= prototype state =================
const qs = new URLSearchParams(location.search);
const P = { variant: qs.get('variant') || 'D', theme: qs.get('theme'), echo: qs.get('echo') || 'two', strat: qs.get('strat') || 'single', dialog: null, focus: 0, pickSlot: 2 };
const CUSTOM = [{ name: 'Changli (my rotation)', weights: { ...BUILTIN.find(t => t.name === 'Changli').weights, Liberation: 2.4 } }];
const tableByName = n => CUSTOM.find(t => t.name === n) || BUILTIN.find(t => t.name === n);

const tagFor = n => isCustom(n) ? '<span class="tag">Custom</span>' : '';
const ECHO = {

  full: [{ type: 'Critical_Rate', value: 8.1 }, { type: 'Critical_Damage', value: 16.2 }, { type: 'Atk_Percent', value: 9.4 }, { type: 'Energy_Regen', value: 8.4 }, { type: 'Liberation', value: 7.9 }],
};

// ================= distribution chart =================
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }
function distChart(ev, fi) {
  const ser = ev.map((r, i) => ({ r, i })).filter(s => s.r.dist); if (!ser.length) return '';

// ================= Echo Evaluation =================
function echoEvaluation() {

  const slots = [0, 1, 2, 3, 4].map(i => {
    const s = echo[i], lvl = `<span class="lvl">+${(i + 1) * 5}</span>`;
    if (P.echo === 'picking' && i === P.pickSlot) return `<div class="slot picking"><div class="small">${s ? `Change the Substat at +${(i + 1) * 5}` : `Which Substat did +${(i + 1) * 5} reveal?`}</div>
      <div class="typegrid">${TYPES.filter(t => !echo.some((e, j) => e.type === t.key && j !== i)).map(t => `<button ${s && s.type === t.key ? 'style="border-color:var(--acc)"' : ''}>${t.name}</button>`).join('')}</div><button class="link" data-act="pick-cancel">Cancel</button></div>`;
    if (s) return `<div class="slot">${lvl}<span class="sn">${T[s.type].name}</span><span class="sv">${fmtRoll(s.type, s.value)}</span>
      ${action('change', `Change the Substat at +${(i + 1) * 5}`, `data-act="pick" data-i="${i}"`)}${removeBtn(`Remove ${T[s.type].name}`)}</div>`;
    if (i === n) return `<div class="slot open next" data-act="pick" data-i="${i}">${lvl}<span class="sn">Add the Substat revealed at +${(i + 1) * 5}</span></div>`;
    return `<div class="slot open">${lvl}<span class="sn">not tuned yet</span></div>`;
  }).join('');
  const ev = rows.map(r => evaluate(echo, r));
  const reached = b => b ? '<span class="good">Reached</span>' : '<span class="bad">Not reached</span>';
  const tc = r => full ? (r.reaches == null ? null : reached(r.reaches)) : (r.tgt == null ? null : pct(r.chance));
  const etc = r => full ? (!r.hasEr || r.reachesEr == null ? null : reached(r.reachesEr)) : (r.ert == null ? null : pct(r.erChance));
  let focus;
  if (!rows.length) focus = `<div class="empty"><b>Pick a Substat Weight Table below to see how this Echo scores for that Resonator.</b>
      <span class="small">Each table says how much every Substat is worth to one Resonator. You can add more than one and switch between them.</span></div>`;
  else {
    P.focus = Math.min(P.focus, rows.length - 1);
    const f = ev[P.focus], top = v => v == null ? null : 'Top ' + pct(v);
    const box = (label, v, why, wide) => `<div class="box ${wide ? 'wide' : ''}"><span class="lab">${label}</span><span class="val ${v == null ? 'none' : ''}">${v ?? '—'}</span>${v == null ? `<span class="why">${why}</span>` : ''}</div>`;
    focus = `<h2>${esc(f.tbl.name)}${tagFor(f.tbl.name)}</h2><div class="boxes">
      ${box(full ? tip('target', 'Target Score') : tip('chance', 'Target Chance'), tc(f), 'Set a Target Score below', 1)}
      ${box(full ? tip('erTarget', 'ER Target Score') : tip('erChance', 'ER Target Chance'), etc(f), full && !f.hasEr ? 'No Energy Regen' : 'Set an ER Target Score below', 1)}
      ${box(tip('score', 'Echo Score'), sc(f.cur), '')}
      ${box(tip('top', 'Top Percent'), top(f.top), 'Echo Score is 0')}
      ${box(tip('erTop', 'ER Top Percent'), top(f.erTop), f.hasEr ? 'Echo Score is 0' : 'No Energy Regen')}
      ${box(tip('median', 'Median Echo Score'), sc(full ? f.cur : f.median), '')}
      ${box('Average Echo Score', sc(full ? f.cur : f.avg), '')}
      ${box('Best Echo Score', sc(full ? f.cur : f.best), '')}</div>
      ${full ? '<p class="done-note">Fully tuned: the Echo Score is final.</p>' : distChart(ev, P.focus)}`;
  }
  const list = rows.map((r, i) => { const e = ev[i]; return `<tr class="row ${i === P.focus ? 'focus' : ''}" data-act="focus" data-i="${i}">
      <td><select aria-label="Substat Weight Table"><option>${esc(r.name)}</option></select>${tagFor(r.name)}</td>
      <td><input class="num" value="${esc(r.target)}" aria-label="Target Score for ${esc(r.name)}"></td>
      <td><input class="num" value="${esc(r.erTarget)}" aria-label="ER Target Score for ${esc(r.name)}"></td>
      <td>${sc(e.cur)}</td><td>${tc(e) ?? '<span class="mute">—</span>'}</td><td>${etc(e) ?? '<span class="mute">—</span>'}</td>
      <td>${action('weights', `Weights of ${r.name}`, `data-act="weights" data-name="${esc(r.name)}"`)}${removeBtn(`Remove ${r.name}`)}</td></tr>`; }).join('');
  const head = `<tr><th>${tip('table', 'Substat Weight Table')}</th><th>${tip('target', 'Target Score')}</th><th>${tip('erTarget', 'ER Target Score')}</th><th>${tip('score', 'Echo Score')}</th>
    <th>${full ? 'Target Score' : tip('chance', 'Target Chance')}</th><th>${full ? 'ER Target Score' : tip('erChance', 'ER Target Chance')}</th><th></th></tr>`;
  return `<div class="ee">
    <section class="panel"><h2>Your Echo</h2><p class="stage-now">${stageText(n)}</p>${slots}</section>
    <section><div class="panel">${focus}</div>
      <div class="panel"><h3>Substat Weight Tables</h3>${rows.length ? `<div class="scrollx"><table class="list">${head}${list}</table></div>` : ''}
        <div class="addrow"><select><option>${rows.length ? 'Add another Weight Table…' : 'Choose a Weight Table…'}</option></select></div></div></section></div>`;
}

// ================= Upgrade Strategy =================
const rule = o => Object.assign({ kind: 'count', n: 1, types: [], type: 'Critical_Rate', value: 6.3, score: '' }, o);
const CR = 'Critical_Rate', CD = 'Critical_Damage';
const STRAT = {
  critFirst: () => [[], [[rule({ types: [CR, CD] })]], [], [[rule({ n: 2, types: [CR, CD] })]], []],
  doubleCrit: t => [[], [], [[rule({ n: 2, types: [CR, CD] })], [rule({ kind: 'roll', type: CR, value: 9.3 })], [rule({ kind: 'roll', type: CD, value: 18.6 })]], [], [[rule({ kind: 'score', score: String(topScore(t, 0.1)) })]]],
};
const KINDS = [['count', 'Substat Count'], ['roll', 'Substat Roll'], ['score', 'Echo Score'], ['chance', 'Target Chance']];
const problem = r => r.kind === 'count' && !r.types.length ? 'Pick at least one Substat.' : r.kind === 'score' && num(r.score) == null ? 'Enter an Echo Score.' : null;
function ruleRow(r, ri) {
  const kind = `<select aria-label="Kind of rule">${KINDS.map(([k, l]) => `<option ${k === r.kind ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  let body;
  if (r.kind === 'count') body = `at least <select><option>${r.n}</option></select> of <span class="pick">${r.types.map(t => T[t].name).join(', ') || 'pick Substats'}</span>`;
  else if (r.kind === 'roll') body = `<select><option>${T[r.type].name}</option></select> at least <select><option>${r.value}</option></select>`;
  else body = `at least <input class="num" value="${esc(r.score)}" aria-label="Echo Score">`;
  const pr = problem(r);
  return `<div class="rule ${pr ? 'unfinished' : ''}">${ri ? '<span class="and">and</span>' : ''}${kind} ${body}${removeBtn('Remove this rule')}${pr ? `<span class="problem">${pr}</span>` : ''}</div>`;
}
function stagesEditor(stages, res, stale) {
  return stages.map((gs, si) => {
    const s = si + 1, d = res ? res.disc[s] : 0;
    const groups = gs.map((g, gi) => `${gi ? '<span class="or">or</span>' : ''}<div class="group">${g.map(ruleRow).join('')}<button class="link small">+ and</button></div>`).join('');
    return `<section class="stage"><div><h3><span class="dot" style="background:var(--st${s})"></span>${stageText(s)}</h3>
        <div class="${stale ? 'stale-wrap' : ''}"><div class="dbar"><span style="width:${Math.max(d * 100, 0)}%;background:var(--st${s})"></span></div>
        <span class="small">${gs.length ? `${pct1(d)} ${tip('discard', 'discarded here')}` : '<span class="mute">nothing discarded</span>'}</span></div></div>
      <div>${gs.length ? groups + '<button class="link small" style="margin-top:4px">+ or</button>' : '<p class="mute" style="margin:0">Every Echo that reaches this stage keeps tuning.</p><button class="link small">+ add a rule</button>'}</div></section>`;
  }).join('');
}
const fateBar = res => `<div class="fate">${res.disc.slice(1).map((d, i) => `<span style="width:${d * 100}%;background:var(--st${i + 1})" title="Discarded at ${stageText(i + 1)}: ${pct1(d)}"></span>`).join('')}<span style="width:${res.sr * 100}%;background:var(--succ)" title="Successful: ${pct1(res.sr)}"></span></div>
  <div class="fate-key">${[1, 2, 3, 4, 5].filter(s => res.disc[s] > 0).map(s => `<span><i style="background:var(--st${s})"></i>${s}/5</span>`).join('')}<span><i style="background:var(--succ)"></i>Successful</span></div>`;
function resultsPanel(res, stale) {
  const c = res.cost;
  return `<aside class="panel res">${stale ? `<div class="stale-msg">Results are from before your last change. Finish the highlighted rule at ${stageText(3)} to update them.</div>` : ''}
    <div class="${stale ? 'stale-wrap' : ''}"><div class="big">${pct1(res.sr)}</div><div>${tip('success', 'Success Rate')}</div>
    ${fateBar(res)}<div class="small mute" style="margin-top:2px">${tip('fate', 'Where Echoes end')}</div>
    <h3>${tip('cost', 'Average cost per Successful Echo')}</h3>
    ${c ? `<table class="cost"><tr><td>Echoes started</td><td class="n">${c.echoes.toFixed(2)}</td></tr><tr><td>Echo EXP</td><td class="n">${int(c.exp)}</td></tr><tr><td>Tuners</td><td class="n">${int(c.tuners)}</td></tr><tr><td>Shell Credits</td><td class="n">${int(c.shell)}</td></tr></table>` : '<p>No Echo passes every Tune Stage.</p>'}
    ${res.avg != null ? `<table class="cost"><tr><td>Average Echo Score of Successful Echoes</td><td class="n">${sc(res.avg)}</td></tr><tr><td>Lowest Echo Score of a Successful Echo</td><td class="n">${sc(res.min)}</td></tr></table>` : ''}</div></aside>`;
}
const ruleText = r => r.kind === 'count' ? `at least ${r.n} of ${r.types.map(t => T[t].name).join(', ')}` : r.kind === 'roll' ? `${T[r.type].name} at least ${r.value}` : `Echo Score at least ${r.score}`;
const groupsText = gs => gs.length ? gs.map(g => g.map(ruleText).join(' and ')).join(' <span class="and">or</span> ') : '<span class="mute">every Echo keeps tuning</span>';
function compareBlock(A, B) {
  const row = (label, a, b, fmt, lowerBetter) => { let d = '';
    if (a != null && b != null && Math.abs(b - a) > 1e-12) { const better = lowerBetter ? b < a : b > a; d = `<span class="${better ? 'better' : 'worse'}">${b > a ? '+' : '−'}${fmt(Math.abs(b - a))}</span>`; }
    return `<tr><td>${label}</td><td>${a == null ? '—' : fmt(a)}</td><td>${b == null ? '—' : fmt(b)}</td><td>${d}</td></tr>`; };
  const c = (r, k) => r.cost ? r.cost[k] : null, maxD = Math.max(0.05, ...[A, B].flatMap(x => [...x.disc.slice(1), x.sr]));
  const pairs = [1, 2, 3, 4, 5, 6].map(s => { const a = s < 6 ? A.disc[s] : A.sr, b = s < 6 ? B.disc[s] : B.sr;
    return `<div class="p"><span style="height:${a / maxD * 100}%;background:var(--pa)" title="A: ${pct1(a)}"></span><span style="height:${b / maxD * 100}%;background:var(--pb)" title="B: ${pct1(b)}"></span></div>`; }).join('');
  return `<div class="panel"><div class="scrollx"><table class="cmp"><tr><th></th><th>Strategy A</th><th>Strategy B</th><th>B compared with A</th></tr>
    ${row(tip('success', 'Success Rate'), A.sr, B.sr, pct1, false)}
    ${row('Echoes started per Successful Echo', c(A, 'echoes'), c(B, 'echoes'), x => x.toFixed(2), true)}
    ${row('Echo EXP per Successful Echo', c(A, 'exp'), c(B, 'exp'), int, true)}
    ${row('Tuners per Successful Echo', c(A, 'tuners'), c(B, 'tuners'), int, true)}
    ${row('Shell Credits per Successful Echo', c(A, 'shell'), c(B, 'shell'), int, true)}
    ${row('Average Echo Score of Successful Echoes', A.avg, B.avg, sc, false)}
    ${row('Lowest Echo Score of a Successful Echo', A.min, B.min, sc, false)}</table></div>
    <h3 style="margin-top:var(--gap)">${tip('fate', 'Where Echoes end')} <span class="legend" style="display:inline-flex;margin-left:10px"><span><i style="border-color:var(--pa)"></i>A</span><span><i style="border-color:var(--pb)"></i>B</span></span></h3>
    <div class="pairs">${pairs}</div><div class="pair-lab">${[1, 2, 3, 4, 5].map(s => `<span>${s}/5 (+${s * 5})</span>`).join('')}<span>Successful</span></div></div>`;
}
function upgradeStrategy() {
  const tbl = tableByName('Changli'), w = tbl.weights;
  const exSel = `<label>Start from an example <select><option>Choose…</option></select></label>`;
  const head = extra => `<div class="us-head"><label>${tip('table', 'Substat Weight Table')} <select><option>Changli</option></select></label>${extra}</div>`;
  const a = STRAT.critFirst(), resA = simulate(a, w);
  if (P.strat === 'compare') {
    const b = STRAT.doubleCrit(tbl), resB = simulate(b, w);
    return head('<button class="btn">Stop comparing</button>') + `<div class="cols">
      <section class="panel col"><h2>Strategy A <button class="btn">Edit</button></h2><div style="margin-bottom:8px">${exSel}</div>
        ${a.map((gs, si) => `<div class="sumline"><b>${stageText(si + 1)}</b><span>${groupsText(gs)}</span></div>`).join('')}</section>
      <section class="panel col"><h2>Strategy B <button class="btn primary">Done</button></h2><div style="margin-bottom:8px">${exSel}</div>${stagesEditor(b, resB)}</section></div>
      <div style="margin-top:var(--gap)">${compareBlock(resA, resB)}</div>`;
  }
  const stale = P.strat === 'unfinished', stages = stale ? a.map((g, i) => i === 2 ? [[rule({ kind: 'score' })]] : g) : a;
  return head(exSel + '<button class="btn">Compare with another strategy</button>') + `<div class="us"><section class="panel">${stagesEditor(stages, resA, stale)}</section>${resultsPanel(resA, stale)}</div>`;
}

// ================= About =================
function about() {
  const secs = [['what', 'What Echo Helper does'], ['evaluating', 'Evaluating an Echo'], ['scores', 'Echo Score and Reference Rolls'], ['tables', 'Substat Weight Tables'], ['strategies', 'Upgrade Strategies'], ['credits', 'Credits'], ['disclaimer', 'Disclaimer']];
  const body = {
    what: '<p>Echo Helper answers two questions for Wuthering Waves players. Echo Evaluation tells you how good an Echo is for a Resonator and how likely it is to reach the Echo Score you want. Upgrade Strategy works out what it costs, on average, to get one good Echo if you discard Echoes that miss your rules at each Tune Stage.</p>',
    evaluating: '<p>Pick a Substat Weight Table for the Resonator, enter the Substats the Echo has revealed so far, and set a Target Score. Every result updates as you type. (The full walkthrough of each result and the chart goes here.)</p>',
    scores: `<p>Each Substat adds its weight times its value divided by that Substat\'s Reference Roll. Crit Rate 8.1 at weight 4 adds 4 × 8.1 / 7.5 = 4.32.</p>
      <table><tr><th>Substat</th><th>Reference Roll</th></tr>${TYPES.map(t => `<tr><td>${t.name}</td><td>${fmtRoll(t.key, t.ref)}</td></tr>`).join('')}</table>`,
    tables: '<p>Built-in tables are baselines worked out by theorycrafters, not the one correct answer. The Crit Rate weight is the worth of a roll while Crit Rate is below 100%. (Notes on individual tables, and Custom tables, go here.)</p>',
    strategies: '<p>Rules in one box must all hold; boxes joined by “or” are other ways to pass. A discarded Echo refunds 75% of its EXP and 30% of its Tuners, but no Shell Credits. (The four rule kinds and the cost explanation go here.)</p>',
    credits: '<p>Thanks to ChemX32, Maygi and riley, whose calculations the built-in Substat Weight Tables come from.</p>',
    disclaimer: '<p>Echo Helper is a fan project and is not affiliated with Kuro Games. (Wording is ticket 12.)</p>',
  };
  const cur = location.hash.slice(7) || 'what';
  return `<div class="about-grid"><nav class="toc-side" aria-label="About sections">${secs.map(([id, t]) => `<a href="#about-${id}" class="${id === cur ? 'on' : ''}">${t}</a>`).join('')}</nav>
    <div class="about">${secs.map(([id, t]) => `<section id="about-${id}"><h2>${t}</h2>${body[id]}</section>`).join('')}</div></div>`;
}

// ================= dialog =================
function dialog() {
  const t = tableByName(P.dialog), max = Math.max(...Object.values(t.weights)), custom = isCustom(t.name);
  const rows = TYPES.slice().sort((a, b) => (t.weights[b.key] || 0) - (t.weights[a.key] || 0)).map(tp => { const v = t.weights[tp.key] || 0;
    return `<span class="${v ? '' : 'z'}">${tp.name}</span><span class="n ${v ? '' : 'z'}">${v}</span><span class="b"><span style="width:${v / max * 100}%"></span></span>`; }).join('');
  return `<div class="scrim" data-act="close"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(t.name)}">
    <h2 style="margin-top:0">${esc(t.name)}${tagFor(t.name)}</h2>
    <p class="small mute" style="margin:0">${custom ? 'Your own table. Only this browser has it.' : 'Built-in baseline. Duplicate it to change the weights.'} The weight is how much one Reference Roll of each Substat is worth.</p>
    <div class="wt">${rows}</div>
    <div class="dlg-btns">${custom ? '<button class="btn">Delete</button><button class="btn">Edit</button>' : ''}<button class="btn">Duplicate</button><button class="btn primary" data-act="close">Close</button></div></div></div>`;
}

// ================= render =================
const TABS = [['echo-evaluation', 'Echo Evaluation'], ['upgrade-strategy', 'Upgrade Strategy'], ['about', 'About']];
const PURPOSE = {
  'echo-evaluation': 'See how good an Echo is for a Resonator, and how likely it is to reach your Target Score once fully tuned.',
  'upgrade-strategy': 'Decide which Echoes to keep tuning at each Tune Stage, and see what one Successful Echo costs on average.',
};
const tabNow = () => { const h = location.hash.slice(1); return h.startsWith('about') ? 'about' : TABS.some(t => t[0] === h) ? h : 'echo-evaluation'; };
function render() {
  V = VARIANTS[P.variant] || VARIANTS.A;
  const sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const theme = P.theme || (V.theme === 'system' ? sys : V.theme);
  document.body.className = `v${P.variant} ${theme}`;
  const tab = tabNow();
  document.getElementById('app').innerHTML = `<header class="top"><div class="wrap"><div class="brand">Echo Helper</div><nav class="tabs">${TABS.map(([id, l]) => `<a href="#${id}" class="${id === tab ? 'on' : ''}">${l}</a>`).join('')}</nav></div></header>
    <div class="wrap">${PURPOSE[tab] ? `<p class="purpose">${PURPOSE[tab]} <a href="#about-${tab === 'echo-evaluation' ? 'evaluating' : 'strategies'}">How it works</a></p>` : ''}
    <main>${tab === 'echo-evaluation' ? echoEvaluation() : tab === 'upgrade-strategy' ? upgradeStrategy() : about()}</main></div>${P.dialog ? dialog() : ''}`;
  const btn = (k, v, l, cur) => `<button data-p="${k}" data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`;
  document.getElementById('bar').innerHTML = `<button data-cycle="-1" aria-label="Previous direction">◀</button><b>${P.variant} · ${V.name}</b><button data-cycle="1" aria-label="Next direction">▶</button><span class="sep"></span>
    ${btn('theme', 'light', 'Light', theme)}${btn('theme', 'dark', 'Dark', theme)}<span class="sep"></span>
    ${tab === 'upgrade-strategy' ? btn('strat', 'single', 'One strategy', P.strat) + btn('strat', 'compare', 'Compare', P.strat) + btn('strat', 'unfinished', 'Unfinished rule', P.strat)
      : btn('echo', 'empty', 'First open', P.echo) + btn('echo', 'two', '2/5', P.echo) + btn('echo', 'picking', 'Picking', P.echo) + btn('echo', 'full', '5/5', P.echo)}
    <span class="sep"></span><button data-state>State</button>`;
  document.getElementById('state').textContent = JSON.stringify({ direction: P.variant + ' ' + V.name, theme, tab, echo: P.echo, strategy: P.strat, focus: P.focus, dialog: P.dialog, tokens: V }, null, 1);
  const anchor = location.hash.slice(1); if (anchor.startsWith('about-')) { const el = document.getElementById(anchor); if (el) el.scrollIntoView(); }
}
function setUrl() { const u = new URL(location); u.searchParams.set('variant', P.variant); if (P.theme) u.searchParams.set('theme', P.theme); else u.searchParams.delete('theme'); history.replaceState(null, '', u); }
function cycle(d) { const ks = Object.keys(VARIANTS); P.variant = ks[(ks.indexOf(P.variant) + d + ks.length) % ks.length]; P.theme = null; setUrl(); render(); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-cycle]'); if (c) return cycle(+c.dataset.cycle);
  const p = e.target.closest('[data-p]'); if (p) { P[p.dataset.p] = p.dataset.v; if (p.dataset.p === 'theme') setUrl(); return render(); }
  if (e.target.closest('[data-state]')) { document.getElementById('state').hidden ^= 1; return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'focus') { if (e.target.closest('button, input, select')) return; P.focus = +t.dataset.i; }
  if (act === 'weights') P.dialog = t.dataset.name;
  if (act === 'close') { if (t.classList.contains('scrim') && e.target !== t) return; P.dialog = null; }
  if (act === 'pick') { P.echo = 'picking'; P.pickSlot = +t.dataset.i; }
  if (act === 'pick-cancel') P.echo = 'two';
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { P.dialog = null; hideTip(); render(); return; }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
window.addEventListener('hashchange', render);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
// tooltips: hover or focus on desktop, tap on a phone; a tap elsewhere closes
const tipbox = document.getElementById('tipbox');
function showTip(el) { tipbox.textContent = el.dataset.tip; tipbox.hidden = false; const r = el.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - w - 8), y = r.bottom + 6; if (y + h > innerHeight - 70) y = r.top - h - 6; tipbox.style.left = x + 'px'; tipbox.style.top = y + 'px'; }
function hideTip() { tipbox.hidden = true; }
document.addEventListener('mouseover', e => { const t = e.target.closest('.tip'); t ? showTip(t) : (document.activeElement && document.activeElement.classList.contains('tip') ? 0 : hideTip()); });
document.addEventListener('focusin', e => { const t = e.target.closest('.tip'); t ? showTip(t) : hideTip(); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.tip')) hideTip(); });
render();
</script>
</body>
</html>
