<!doctype html>
<!--
  PROTOTYPE, throwaway. Ticket: How both tabs work on a phone (.scratch/web-rewrite/issues/16-phone-layout.md)
  Question: how does each tab work at 360-430px wide without a separate design?
  Starts from variant D of prototypes/11-visual-direction (look and desktop layout unchanged; desktop is everything above 600px).
  Three phone layouts, switched by ?variant=A|B|C, the bar at the bottom, or the arrow keys:
    A  Stack    everything stacks in reading order; the Weight Table list scrolls sideways with its name column pinned;
                popups anchored to their field; strategy results above the stages; comparing stacks A, B, then the difference table
    B  Cards    each listed Weight Table becomes a card; popups are bottom sheets; strategy results are a sticky bar at the top
                that opens into the full panel; comparing shows A or B by a switch, with the differences as stacked rows
    C  Focused  the list is one line per table (name, Target Chance) and the targets move into the focused table's boxes;
                popups go full screen; strategy results sit below the stages with a sticky summary at the bottom;
                comparing is not offered on a phone; About becomes an accordion
  CHOSEN (owner, 2026-11-21): B everywhere, except strategy results and About, which follow C. Comparing is offered (B).
  Open frame.html to see one layout at 360, 390 and 430px side by side (real narrow viewports, each an iframe).
  Mostly read-only, as prototype 11. Strategy results are sampled (prototype 08's method) and ignore Target Chance rules.
  Texts are ticket 17's final wording. Fonts load from Google Fonts here; the app would self-host.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Echo Helper on a phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="tables.js"></script>
<style>
/* ================= tokens: variant D of ticket 11 ================= */
body { --font:"Onest", system-ui, sans-serif; --fs:15px; --radius:10px; --radius-s:6px; --pad:20px; --gap:20px; --big:30px; --row:10px; }
body.light { --bg:#f3f5f9; --panel:#fff; --panel2:#f3f5f9; --ink:#18202e; --mute:#5a6478; --line:#d8dee8; --acc:#3346c8; --acc-ink:#fff; --acc-soft:#e8ebfb;
  --er:#0e7f7f; --other:#b9c0cd; --good:#1d7a46; --bad:#b42a2a; --bad-soft:#fbeaea;
  --st1:#9fd8cf; --st2:#62bdb5; --st3:#4697ad; --st4:#5a74b0; --st5:#7455a6; --succ:#d99a22; --pa:#3346c8; --pb:#9aa3b5; }
body.dark { --bg:#121722; --panel:#1a2130; --panel2:#222b3c; --ink:#e7ebf3; --mute:#9ba5b8; --line:#2f394c; --acc:#8f9cff; --acc-ink:#10142a; --acc-soft:#262f52;
  --er:#46c8c8; --other:#4d566a; --good:#55c98a; --bad:#ff8080; --bad-soft:#3a2026;
  --st1:#2c625d; --st2:#36817d; --st3:#3f87a3; --st4:#6279c4; --st5:#8d6fd0; --succ:#f0b84a; --pa:#8f9cff; --pb:#6b7487; }

/* ================= desktop structure (ticket 11, variant D) ================= */
* { box-sizing:border-box; }
html { color-scheme:light; } body.dark { color-scheme:dark; }
body { margin:0; font:var(--fs)/1.5 var(--font); color:var(--ink); background:var(--bg); padding-bottom:90px; font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }
body.embed { padding-bottom:20px; }
button, select, input { font:inherit; color:inherit; }
h1, h2, h3 { line-height:1.25; }
a { color:var(--acc); }
:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.mute { color:var(--mute); } .small { font-size:.86em; }
.wrap { max-width:1220px; margin:0 auto; padding:0 var(--pad); }

header.top { background:var(--panel); border-bottom:1px solid var(--line); }
header.top .wrap { display:flex; align-items:stretch; gap:28px; }
.brand { font-weight:700; font-size:1.12em; padding:14px 0; white-space:nowrap; }
nav.tabs { display:flex; gap:4px; }
nav.tabs a { display:flex; align-items:center; padding:0 12px; color:var(--mute); text-decoration:none; border-bottom:3px solid transparent; white-space:nowrap; }
nav.tabs a.on { color:var(--ink); border-bottom-color:var(--acc); font-weight:600; }
.hright { margin-left:auto; display:flex; align-items:center; gap:10px; }
.upd { color:var(--mute); font-size:.86em; white-space:nowrap; }
.purpose { padding:12px 0 0; color:var(--mute); margin:0; }
main { padding:var(--gap) 0; }

.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:var(--pad); }
section > .panel + .panel { margin-top:var(--gap); }
.panel > h2:first-child, .panel > h3:first-child { margin-top:0; }
h2 { font-size:1.15em; margin:0 0 10px; } h3 { font-size:1em; margin:0 0 8px; }
.tag { font-size:.72em; font-weight:600; padding:1px 7px; border-radius:99px; background:var(--acc-soft); color:var(--acc); margin-left:8px; vertical-align:middle; white-space:nowrap; }

.tip { text-decoration:underline dotted; text-decoration-color:var(--mute); text-underline-offset:3px; cursor:help; }
#tipbox { position:fixed; z-index:60; max-width:min(290px, calc(100vw - 20px)); background:var(--ink); color:var(--bg); padding:8px 11px; border-radius:var(--radius-s); font-size:.88em; line-height:1.4; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.18); }

button.ibtn { border:1px solid transparent; background:none; color:var(--mute); cursor:pointer; padding:4px; border-radius:var(--radius-s); display:inline-flex; flex:none; }
button.ibtn.rm:hover { color:var(--bad); }
button.ibtn:hover { color:var(--acc); border-color:var(--line); background:var(--panel2); }
button.ibtn svg { width:16px; height:16px; }
button.btn { border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-s); padding:5px 12px; cursor:pointer; }
button.btn:hover { border-color:var(--acc); }
button.btn.primary { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); }
button.btn:disabled { opacity:.5; cursor:default; }
button.link { border:none; background:none; color:var(--acc); padding:2px 0; cursor:pointer; }
select, input { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-s); padding:3px 7px; }
input.num { width:5.2em; text-align:right; }

/* Echo Evaluation */
.ee > *, .us > *, .cols > * { min-width:0; }
.ee { display:grid; grid-template-columns:330px minmax(0,1fr); gap:var(--gap); align-items:start; }
.stage-now { font-weight:600; margin:0 0 10px; }
.slot { display:flex; align-items:center; gap:8px; min-height:46px; padding:6px 10px; border:1px solid var(--line); border-radius:var(--radius-s); margin-bottom:var(--row); }
.slot .lvl { color:var(--mute); font-size:.86em; width:2.4em; flex:none; }
.slot .sn { flex:1; line-height:1.25; min-width:0; }
.slot .sv { font-weight:700; }
.slot.open { border-style:dashed; color:var(--mute); }
.slot.next { border-color:var(--acc); color:var(--acc); cursor:pointer; }
.slot.picking { display:block; border-color:var(--acc); padding:10px; }
.typegrid { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin:0 0 8px; }
.typegrid.vals { grid-template-columns:repeat(4, 1fr); }
.typegrid button { text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-s); padding:5px 8px; cursor:pointer; font-size:.9em; line-height:1.25; min-height:36px; }
.typegrid.vals button { text-align:center; font-weight:600; }
.typegrid button.cur { border-color:var(--acc); }
.pickbtns { display:flex; gap:14px; }

.res-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; min-width:0; }
.res-head h2 { margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.calc { margin-left:auto; flex:none; color:var(--mute); font-size:.86em; min-width:7.5em; text-align:right; }
.faded { opacity:.42; }
.boxes { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:var(--row); }
.box { grid-column:span 2; background:var(--panel2); border-radius:var(--radius-s); padding:9px 12px; display:flex; flex-direction:column; min-width:0; min-height:74px; }
.box.wide { grid-column:span 3; min-height:92px; }
.box .lab { font-size:.84em; color:var(--mute); }
.box .val { font-weight:700; font-size:1.3em; line-height:1.25; white-space:nowrap; }
.box.wide .val { font-size:var(--big); }
.box .why { font-size:.84em; color:var(--mute); }
.box .val.none { color:var(--mute); font-weight:400; }
.box .tin { display:none; }
.good { color:var(--good); } .bad { color:var(--bad); }
.chart-head { display:flex; justify-content:space-between; align-items:baseline; margin:var(--gap) 0 4px; gap:10px; min-width:0; }
.chart-head h3 { margin:0; flex:none; }
.legend { display:flex; gap:14px; font-size:.84em; color:var(--mute); white-space:nowrap; overflow:hidden; min-width:0; }
.legend > span { overflow:hidden; text-overflow:ellipsis; }
.legend > span.fname { flex:0 1 auto; min-width:3em; } .legend > span:not(.fname) { flex:none; }
.legend i { display:inline-block; width:18px; height:0; border-top:3px solid; vertical-align:middle; margin-right:5px; }
.legend i.focus { border-color:var(--acc); } .legend i.other { border-color:var(--other); }
.legend i.tgt { border-top:2px dashed var(--ink); } .legend i.ert { border-top:2px dotted var(--er); }
svg.dist { width:100%; height:auto; display:block; overflow:visible; }
svg .ax { fill:var(--mute); font:11px var(--font); }
svg .grid { stroke:var(--line); stroke-width:1; }
svg .s-other { fill:none; stroke:var(--other); stroke-width:1.5; }
svg .s-focus { fill:none; stroke:var(--acc); stroke-width:2.2; stroke-linejoin:round; }
svg .s-fill { fill:var(--acc); opacity:.18; }
svg .tgt { stroke:var(--ink); stroke-width:1.5; stroke-dasharray:6 4; }
svg .ert { stroke:var(--er); stroke-width:2; stroke-dasharray:1.5 4; stroke-linecap:round; }
.empty { border:1px dashed var(--line); border-radius:var(--radius); padding:28px; text-align:center; color:var(--mute); }
.empty b { color:var(--ink); display:block; margin-bottom:4px; font-size:1.05em; }

.scrollx { overflow-x:auto; }
table.list { border-collapse:collapse; width:100%; }
table.list th { font-weight:600; font-size:.84em; color:var(--mute); text-align:right; padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:bottom; line-height:1.25; }
table.list td { padding:var(--row) 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
table.list th:first-child, table.list td:first-child { text-align:left; }
table.list tr.row { cursor:pointer; }
table.list tr.row.focus td { background:var(--acc-soft); }
table.list tr.row.focus td:first-child { box-shadow:inset 3px 0 0 var(--acc); }
table.list select { max-width:190px; }
table.list input.num { width:4.4em; }
table.list td:last-child { padding-left:2px; padding-right:0; }
.addrow { margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.cards, .lines { display:none; }

/* Upgrade Strategy */
.us-head { display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; margin-bottom:var(--gap); }
.us-head label { display:flex; gap:8px; align-items:center; }
.us { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:var(--gap); align-items:start; }
.stage { display:grid; grid-template-columns:180px minmax(0,1fr); gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
.stage:first-child { padding-top:0; } .stage:last-child { border-bottom:none; padding-bottom:0; }
.stage h3 { margin:0 0 6px; white-space:nowrap; }
.stage h3 .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; }
.dbar { height:7px; background:var(--panel2); border-radius:99px; overflow:hidden; margin:6px 0 3px; }
.dbar span { display:block; height:100%; border-radius:99px; }
.group { border-left:3px solid var(--line); padding:2px 0 4px 12px; }
.rule { display:flex; flex-wrap:wrap; align-items:center; gap:5px 7px; padding:4px 0; position:relative; }
.rule .phrase { display:contents; }
.rule .kindline { display:contents; }
.rule.unfinished { background:var(--bad-soft); box-shadow:0 0 0 1px var(--bad); border-radius:var(--radius-s); padding:6px 8px; margin:2px 0; }
.rule .problem { flex-basis:100%; color:var(--bad); font-size:.86em; }
.pick { border:1px solid var(--line); border-radius:var(--radius-s); padding:3px 9px; background:var(--panel); cursor:pointer; text-align:left; }
.and, .or { font-weight:600; color:var(--mute); font-size:.84em; }
.or { margin:6px 0 6px 2px; display:block; }
.res { position:sticky; top:12px; }
.res .big { font-size:calc(var(--big) + 6px); font-weight:700; line-height:1.1; }
.fate { display:flex; height:16px; border-radius:var(--radius-s); overflow:hidden; background:var(--panel2); margin:12px 0 6px; }
.fate span { display:block; height:100%; }
.fate-key { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.8em; color:var(--mute); }
.fate-key i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
table.cost { border-collapse:collapse; width:100%; margin:4px 0 12px; }
table.cost td { padding:3px 0; } table.cost td.n { text-align:right; white-space:nowrap; padding-left:10px; }
.res h3 { margin:var(--gap) 0 4px; font-size:.95em; }
.stale-msg { color:var(--bad); font-size:.88em; margin:0 0 10px; padding:8px 10px; background:var(--bad-soft); border-radius:var(--radius-s); }
.res-bar, .res-foot, .seg, .cmp-rows, .narrow-note { display:none; }

.cols { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
.col h2 { display:flex; justify-content:space-between; align-items:center; }
.sumline { display:grid; grid-template-columns:150px 1fr; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
.sumline:last-child { border-bottom:none; }
.col .stage { grid-template-columns:1fr; gap:4px; }
table.cmp { border-collapse:collapse; width:100%; }
table.cmp th, table.cmp td { text-align:right; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.cmp th { font-size:.84em; color:var(--mute); font-weight:600; }
table.cmp th:first-child, table.cmp td:first-child { text-align:left; white-space:normal; }
.better, .worse { font-weight:600; padding:1px 8px; border-radius:99px; white-space:nowrap; }
.better { color:var(--good); background:color-mix(in srgb, var(--good) 15%, transparent); }
.worse { color:var(--bad); background:color-mix(in srgb, var(--bad) 15%, transparent); }
.pairs { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; align-items:end; height:150px; border-bottom:1px solid var(--line); margin-top:8px; }
.pairs .p { display:flex; gap:3px; align-items:flex-end; justify-content:center; height:100%; }
.pairs .p span { width:24px; border-radius:var(--radius-s) var(--radius-s) 0 0; min-height:1px; }
.pair-lab { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; text-align:center; font-size:.78em; color:var(--mute); margin-top:4px; }

/* About */
.about-grid { display:grid; grid-template-columns:220px minmax(0,1fr); gap:calc(var(--gap) * 2); align-items:start; }
.about { max-width:68ch; }
.toc-side { position:sticky; top:16px; display:flex; flex-direction:column; border-left:2px solid var(--line); }
.toc-side a { color:var(--mute); text-decoration:none; padding:6px 0 6px 14px; margin-left:-2px; border-left:2px solid transparent; }
.toc-side a.on { color:var(--ink); border-left-color:var(--acc); font-weight:600; }
.toc-jump { display:none; }
.about section { padding:6px 0 18px; border-bottom:1px solid var(--line); }
.about h2 { margin-top:16px; }
.about p { line-height:1.6; }
.about table { border-collapse:collapse; }
.about td, .about th { padding:3px 18px 3px 0; text-align:left; border-bottom:1px solid var(--line); }
.about details { border-bottom:1px solid var(--line); }
.about summary { padding:12px 0; font-weight:600; cursor:pointer; }

/* popups: dialog (desktop and A), anchored popover (A), sheet (B), full screen (C) */
.scrim { position:fixed; inset:0; background:rgba(10,15,25,.45); display:flex; align-items:center; justify-content:center; z-index:30; padding:14px; }
.dialog { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:var(--pad); width:min(460px,100%); max-height:90vh; overflow:auto; box-shadow:0 18px 50px rgba(0,0,0,.3); }
.pop { position:absolute; z-index:25; top:calc(100% + 4px); left:0; width:min(300px, calc(100vw - 24px)); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px; box-shadow:0 12px 30px rgba(0,0,0,.25); }
.checks { display:grid; grid-template-columns:1fr; gap:2px; margin:0 0 10px; }
.checks label { display:flex; gap:9px; align-items:center; padding:5px 2px; line-height:1.25; }
.checks input { width:18px; height:18px; margin:0; flex:none; }
.wt { display:grid; grid-template-columns:1fr 3.2em 90px; gap:6px 10px; align-items:center; margin:12px 0; font-size:.92em; }
.wt .n { text-align:right; }
.wt .b { height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; } .wt .b span { display:block; height:100%; background:var(--acc); }
.wt .z { color:var(--mute); }
.dlg-btns { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.dlg-top { display:flex; align-items:center; gap:10px; }
.dlg-top h2 { margin:0; flex:1; min-width:0; }

/* tablet: the stacking prototype 11 already had */
@media (max-width: 820px) {
  .ee, .us, .cols { grid-template-columns:1fr; }
  .res { position:static; order:-1; }
  .stage { grid-template-columns:1fr; gap:4px; }
  .about-grid { grid-template-columns:1fr; } .toc-side { position:static; }
}

/* ================= phone: shared by all three layouts ================= */
@media (max-width: 600px) {
  body { --pad:12px; --gap:12px; --big:26px; --row:8px; --fs:15px; }
  .panel { padding:14px; }
  header.top .wrap { display:grid; grid-template-columns:1fr auto; gap:0; }
  .brand { padding:10px 0 4px; }
  .hright { grid-column:2; grid-row:1; }
  nav.tabs { grid-column:1 / -1; gap:0; margin:0 -8px; }
  nav.tabs a { padding:8px 8px 9px; }
  .purpose { font-size:.92em; }
  .slot .sn { font-size:.95em; }
  .stage h3 { font-size:.98em; }
  .us-head { gap:8px; }
  .us-head > * { width:100%; }
  .us-head label { justify-content:space-between; } .us-head select { flex:1; min-width:0; max-width:65%; }
  .group { padding-left:10px; }
  .pairs { gap:6px; height:120px; } .pairs .p span { width:16px; } .pair-lab { gap:6px; }
  .empty { padding:20px 14px; }
  .scrim.dlg { padding:10px; }
  .dialog { padding:16px; }
}

/* ---------- A: Stack ---------- */
@media (max-width: 600px) {
  body.pA .boxes { grid-template-columns:1fr 1fr; } body.pA .box, body.pA .box.wide { grid-column:span 1; }
  body.pA table.list td:first-child, body.pA table.list th:first-child { position:sticky; left:0; background:var(--panel); z-index:1; box-shadow:1px 0 0 var(--line); }
  body.pA table.list tr.row.focus td:first-child { background:var(--acc-soft); box-shadow:inset 3px 0 0 var(--acc), 1px 0 0 var(--line); }
  body.pA table.list select { max-width:150px; }
  body.pA .scrollx { margin:0 -14px; padding:0 14px; }
  body.pA table.cmp td:first-child, body.pA table.cmp th:first-child { position:sticky; left:0; background:var(--panel); min-width:140px; max-width:150px; box-shadow:1px 0 0 var(--line); }
  body.pA .sumline { grid-template-columns:1fr; gap:0; }
  body.pA .about .toc-side { border-left:none; flex-direction:row; flex-wrap:wrap; gap:6px; }
  body.pA .about-grid .toc-side a { border:1px solid var(--line); border-radius:99px; padding:3px 10px; margin:0; font-size:.88em; }
  body.pA .about-grid .toc-side a.on { border-color:var(--acc); }
}

/* ---------- B: Cards ---------- */
@media (max-width: 600px) {
  body.pB .boxes { grid-template-columns:repeat(6, minmax(0,1fr)); gap:6px; }
  body.pB .box { padding:8px 9px; min-height:66px; } body.pB .box.wide { min-height:84px; }
  body.pB .box .val { font-size:1.08em; } body.pB .box.wide .val, body.pC .box.wide .val { font-size:1.6em; } body.pB .box .lab { font-size:.78em; line-height:1.25; }
  body.pB .scrollx.listwrap { display:none; } body.pB .cards { display:block; }
  .card { border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 10px; margin-bottom:8px; cursor:pointer; }
  .card.focus { border-color:var(--acc); background:var(--acc-soft); box-shadow:inset 3px 0 0 var(--acc); }
  .card .c1 { display:flex; align-items:center; gap:4px; }
  .card .c1 select { flex:1; min-width:0; }
  .card .c2 { display:flex; gap:12px; margin-top:8px; }
  .card .c2 label { flex:1; display:flex; flex-direction:column; font-size:.78em; color:var(--mute); gap:2px; }
  .card .c2 input { width:100%; font-size:15px; color:var(--ink); }
  .card .c3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:8px; }
  .card .c3 span { font-size:.78em; color:var(--mute); display:flex; flex-direction:column; line-height:1.3; }

const binom = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };

  const dp = Array.from({ length: k + 1 }, () => new Map()); dp[0].set(used.has('Energy_Regen') ? 1 : 0, 1);

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================= distribution chart (narrower drawing on a phone so text stays readable) =================
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }

// ================= Echo Evaluation =================

      return `<div class="slot picking">${grid}<div class="pickbtns">${P.echo === 'value' ? '<button class="link" data-act="pickback">Back</button>' : ''}<button class="link" data-act="pickdone">Cancel</button></div></div>`;

    if (i === n) return `<div class="slot open next" data-act="pick">${lvl}<span class="sn">Add the Substat revealed at +${(i + 1) * 5}</span></div>`;

  }).join('');
}
function echoEvaluation() {
  const echo = ECHO[P.echo], rows = rowsNow(), full = echo.length === 5, phone = isPhone();
  const ev = rows.map(r => evaluate(echo, r));
  const reached = b => b ? '<span class="good">Reached</span>' : '<span class="bad">Not reached</span>';

    const short = phone && P.variant !== 'A';

      ${box(full ? tip('target', 'Target Score') : tip('chance', 'Target Chance'), tc(f), 'Set a Target Score below', 1, tin('Target', 'target', r0.target))}
      ${box(full ? tip('erTarget', 'ER Target Score') : tip('erChance', 'ER Target Chance'), etc(f), full && !f.hasEr ? 'No Energy Regen' : 'Set an ER Target Score below', 1, tin('ER Target', 'erTarget', r0.erTarget))}
      ${box(tip('score', 'Echo Score'), sc(f.cur), '')}
      ${box(tip('top', 'Top Percent'), top(f.top), '')}
      ${box(tip('erTop', short ? 'ER Top' : 'ER Top Percent'), f.hasEr ? top(f.erTop) : null, 'No Energy Regen')}

  const tableRows = rows.map((r, i) => { const e = ev[i]; return `<tr class="row ${i === P.focus ? 'focus' : ''}" data-act="focus" data-i="${i}">
      <td><select aria-label="Substat Weight Table"><option>${esc(r.name)}</option></select>${tagFor(r.name)}</td>
      <td><input class="num" value="${esc(r.target)}" aria-label="Target Score for ${esc(r.name)}"></td>
      <td><input class="num" value="${esc(r.erTarget)}" aria-label="ER Target Score for ${esc(r.name)}"></td>

  const cards = rows.map((r, i) => { const e = ev[i]; return `<div class="card ${i === P.focus ? 'focus' : ''}" data-act="focus" data-i="${i}">
      <div class="c1"><select aria-label="Substat Weight Table"><option>${esc(r.name)}</option></select>${tagFor(r.name)}${ibtn('weights', `Weights of ${r.name}`, 'data-act="weights"')}${ibtn('remove', `Remove ${r.name}`)}</div>
      <div class="c2"><label>Target Score<input class="num" value="${esc(r.target)}"></label><label>ER Target Score<input class="num" value="${esc(r.erTarget)}"></label></div>
      <div class="c3"><span>Echo Score<b>${sc(e.cur)}</b></span><span>${full ? 'Target' : 'Target Chance'}<b>${tc(e) ?? dash}</b></span><span>${full ? 'ER Target' : 'ER Target Chance'}<b>${etc(e) ?? dash}</b></span></div></div>`; }).join('');
  const lines = rows.length ? `<div class="lh">${full ? 'Target' : 'Target Chance'}</div>` + rows.map((r, i) => { const e = ev[i]; return `<div class="ln ${i === P.focus ? 'focus' : ''}" data-act="focus" data-i="${i}">
      <select aria-label="Substat Weight Table"><option>${esc(r.name)}</option></select><span class="ch">${tc(e) ?? dash}</span>${ibtn('weights', `Weights of ${r.name}`, 'data-act="weights"')}${ibtn('remove', `Remove ${r.name}`)}</div>`; }).join('') : '';

        <div class="addrow"><select><option>${rows.length ? 'Add another Weight Table…' : 'Choose a Weight Table…'}</option></select></div></div></section></div>`;
}

// ================= Upgrade Strategy =================
const rule = o => Object.assign({ kind: 'count', n: 1, types: [], type: 'Critical_Rate', value: 6.3, score: '', chance: '20', ctarget: '24.5' }, o);
const CR = 'Critical_Rate', CD = 'Critical_Damage';
const STRAT = {
  // "Crit first", with an "or" box holding the longest rule phrase (Target Chance), to check wrapping
  a: t => [[], [[rule({ types: [CR, CD] })]], [[rule({ n: 2, types: [CR, CD] })], [rule({ kind: 'chance', chance: '25', ctarget: String(topScore(t, 0.1)) })]], [], [[rule({ kind: 'score', score: String(topScore(t, 0.3)) }), rule({ kind: 'roll', type: 'Energy_Regen', value: 8.4 })]]],
  b: t => [[], [], [[rule({ n: 2, types: [CR, CD] })], [rule({ kind: 'roll', type: CR, value: 9.3 })], [rule({ kind: 'roll', type: CD, value: 18.6 })]], [], [[rule({ kind: 'score', score: String(topScore(t, 0.1)) })]]],
};
const forSim = st => st.map(gs => gs.filter(g => !g.some(r => r.kind === 'chance')));
const KINDS = [['count', 'Substat Count'], ['roll', 'Substat Roll'], ['score', 'Echo Score'], ['chance', 'Target Chance']];
const problem = r => r.kind === 'count' && !r.types.length ? 'Pick at least one Substat.' : r.kind === 'score' && num(r.score) == null ? 'Enter an Echo Score.' : null;
let popupDone = false;
function substatPopup() {
  const body = `<div class="checks">${TYPES.map(t => `<label><input type="checkbox" ${t.crit ? 'checked' : ''}>${t.name}</label>`).join('')}</div>`;
  if (!isPhone() || P.variant === 'A') return `<div class="pop" role="dialog" aria-label="Substats">${body}<div class="dlg-btns"><button class="btn primary" data-act="closepop">Done</button></div></div>`;
  return '';
}
function ruleRow(r, ri, popHere) {
  const kind = `<select aria-label="Kind of rule">${KINDS.map(([k, l]) => `<option ${k === r.kind ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  let body;
  if (r.kind === 'count') body = `at least <select><option>${r.n}</option></select> of <button class="pick" data-act="openpop">${r.types.map(t => T[t].name).join(', ') || 'pick Substats'}</button>${popHere ? substatPopup() : ''}`;
  else if (r.kind === 'roll') body = `<select><option>${T[r.type].name}</option></select> at least <select><option>${fmtRoll(r.type, r.value)}</option></select>`;
  else if (r.kind === 'chance') body = `at least <input class="num" style="width:3.6em" value="${esc(r.chance)}">% chance to reach a Target Score of <input class="num" value="${esc(r.ctarget)}">`;
  else body = `at least <input class="num" value="${esc(r.score)}" aria-label="Echo Score">`;
  const pr = problem(r);
  return `<div class="rule ${pr ? 'unfinished' : ''}"><span class="kindline">${ri ? '<span class="and">and</span>' : ''}${kind}${ibtn('remove', 'Remove this rule')}</span><span class="phrase">${body}</span>${pr ? `<span class="problem">${pr}</span>` : ''}</div>`;
}
function stagesEditor(stages, res, faded) {
  return stages.map((gs, si) => {
    const s = si + 1, d = res ? res.disc[s] : 0;
    const groups = gs.map((g, gi) => `${gi ? '<span class="or">or</span>' : ''}<div class="group">${g.map((r, ri) => ruleRow(r, ri, P.strat === 'popup' && si === 1 && gi === 0)).join('')}<button class="link small">+ and</button></div>`).join('');
    return `<section class="stage"><div><h3><span class="dot" style="background:var(--st${s})"></span>${stageText(s)}</h3>
        <div class="${faded ? 'faded' : ''}"><div class="dbar"><span style="width:${d * 100}%;background:var(--st${s})"></span></div>
        <span class="small">${d > 0 ? `${pct1(d)} ${tip('discard', 'discarded here')}` : '<span class="mute">nothing discarded</span>'}</span></div></div>
      <div>${gs.length ? groups + '<button class="link small" style="margin-top:4px">+ or</button>' : '<button class="link small">+ add a rule</button>'}</div></section>`;
  }).join('');
}
const fateBar = res => `<div class="fate">${res.disc.slice(1).map((d, i) => `<span style="width:${d * 100}%;background:var(--st${i + 1})"></span>`).join('')}<span style="width:${res.sr * 100}%;background:var(--succ)"></span></div>`;
const fateKey = res => `<div class="fate-key">${[1, 2, 3, 4, 5].filter(s => res.disc[s] > 0).map(s => `<span><i style="background:var(--st${s})"></i>${s}/5</span>`).join('')}<span><i style="background:var(--succ)"></i>Successful</span></div>`;
function resultsPanel(res, stale, cls = '') {
  const c = res.cost, faded = stale || P.calc;
  return `<aside class="panel res ${cls}" id="results">${stale ? `<div class="stale-msg">Results are from before your last change. Finish the highlighted rule at ${stageText(3)} to update them.</div>` : ''}
    <div style="display:flex;align-items:baseline"><span class="calc" style="margin-left:auto">${P.calc ? 'Calculating…' : ''}</span></div>
    <div class="${faded ? 'faded' : ''}"><div class="big">${pct1(res.sr)}</div><div>${tip('success', 'Success Rate')}</div>
    ${fateBar(res)}${fateKey(res)}
    <h3>${tip('cost', 'Cost per Successful Echo')}</h3>
    ${c ? `<table class="cost"><tr><td>Echoes started</td><td class="n">${c.echoes.toFixed(2)}</td></tr><tr><td>Echo EXP</td><td class="n">${int(c.exp)}</td></tr><tr><td>Tuners</td><td class="n">${int(c.tuners)}</td></tr><tr><td>Shell Credits</td><td class="n">${int(c.shell)}</td></tr></table>` : '<p>No Echo passes every Tune Stage.</p>'}
    ${res.avg != null ? `<table class="cost"><tr><td>Average Echo Score of Successful Echoes</td><td class="n">${sc(res.avg)}</td></tr><tr><td>Lowest Echo Score of a Successful Echo</td><td class="n">${sc(res.min)}</td></tr></table>` : ''}</div></aside>`;
}
const ruleText = r => r.kind === 'count' ? `at least ${r.n} of ${r.types.map(t => T[t].name).join(', ')}` : r.kind === 'roll' ? `${T[r.type].name} at least ${fmtRoll(r.type, r.value)}` : r.kind === 'chance' ? `at least ${r.chance}% chance to reach a Target Score of ${r.ctarget}` : `Echo Score at least ${r.score}`;
const groupsText = gs => gs.length ? gs.map(g => g.map(ruleText).join(' and ')).join(' <span class="and">or</span> ') : '<span class="mute">every Echo keeps tuning</span>';
function compareBlock(A, B) {
  const rows = [
    ['Success Rate', A.sr, B.sr, pct1, false],
    ['Echoes started per Successful Echo', A.cost?.echoes, B.cost?.echoes, x => x.toFixed(2), true],
    ['Echo EXP per Successful Echo', A.cost?.exp, B.cost?.exp, int, true],
    ['Tuners per Successful Echo', A.cost?.tuners, B.cost?.tuners, int, true],
    ['Shell Credits per Successful Echo', A.cost?.shell, B.cost?.shell, int, true],
    ['Average Echo Score of Successful Echoes', A.avg, B.avg, sc, false],
    ['Lowest Echo Score of a Successful Echo', A.min, B.min, sc, false]];

  const f = (v, fmt) => v == null ? '—' : fmt(v);
  const table = `<div class="scrollx"><table class="cmp"><tr><th></th><th>Strategy A</th><th>Strategy B</th><th>B compared with A</th></tr>
    ${rows.map(([l, a, b, fmt, lb]) => `<tr><td>${l === 'Success Rate' ? tip('success', l) : l}</td><td>${f(a, fmt)}</td><td>${f(b, fmt)}</td><td>${diff(a, b, fmt, lb)}</td></tr>`).join('')}</table></div>`;
  const stacked = `<div class="cmp-rows">${rows.map(([l, a, b, fmt, lb]) => `<div class="cr"><div class="l">${l}</div><div class="v"><span><small>A</small>${f(a, fmt)}</span><span><small>B</small>${f(b, fmt)}</span>${diff(a, b, fmt, lb)}</div></div>`).join('')}</div>`;

    return `<div class="p"><span style="height:${a / maxD * 100}%;background:var(--pa)"></span><span style="height:${b / maxD * 100}%;background:var(--pb)"></span></div>`; }).join('');
  const phone = isPhone();
  return `<div class="panel">${table}${stacked}
    <div class="legend" style="margin-top:var(--gap)"><span><i style="border-color:var(--pa)"></i>A</span><span><i style="border-color:var(--pb)"></i>B</span></div>
    <div class="pairs">${pairs}</div><div class="pair-lab">${[1, 2, 3, 4, 5].map(s => `<span>${phone ? `${s}/5` : `${s}/5 (+${s * 5})`}</span>`).join('')}<span>${phone ? 'Succ.' : 'Successful'}</span></div></div>`;
}
function upgradeStrategy() {
  const tbl = tableByName('Changli'), w = tbl.weights, phone = isPhone();
  const exSel = `<label>Start from an example <select><option>Choose…</option></select></label>`;

// ================= popups: dialog, sheet or full screen =================
function popupShell(title, content, buttons) {
  const phone = isPhone();
  if (phone && P.variant === 'B') return `<div class="sheet-wrap" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="dlg-top"><h2>${title}</h2></div>${content}<div class="dlg-btns">${buttons}</div></div></div>`;
  if (phone && P.variant === 'C') return `<div class="full-wrap" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="full-top">${ibtn('remove', 'Close', 'data-act="close"')}<h2>${title}</h2></div>${content}<div class="dlg-btns">${buttons}</div></div>`;
  return `<div class="scrim dlg" data-act="close"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dlg-top"><h2>${title}</h2></div>${content}<div class="dlg-btns">${buttons}</div></div></div>`;
}
function weightsDialog() {
  const t = tableByName('Changli'), max = Math.max(...Object.values(t.weights));
  const rows = TYPES.slice().sort((a, b) => (t.weights[b.key] || 0) - (t.weights[a.key] || 0)).map(tp => { const v = t.weights[tp.key] || 0;
    return `<span class="${v ? '' : 'z'}">${tp.name}</span><span class="n ${v ? '' : 'z'}">${v}</span><span class="b"><span style="width:${v / max * 100}%"></span></span>`; }).join('');
  return popupShell(esc(t.name), `<p class="small mute" style="margin:6px 0 0">Built-in tables can't be changed. Duplicate it to make your own.</p><div class="wt">${rows}</div>`,
    '<button class="btn">Duplicate</button><button class="btn primary" data-act="close">Close</button>');
}
function substatSheet() {
  return popupShell('Substats', `<div class="checks">${TYPES.map(t => `<label><input type="checkbox" ${t.crit ? 'checked' : ''}>${t.name}</label>`).join('')}</div>`, '<button class="btn primary" data-act="closepop">Done</button>');
}

// ================= render =================
const TABS = [['echo-evaluation', 'Echo Evaluation'], ['upgrade-strategy', 'Upgrade Strategy'], ['about', 'About']];
const PURPOSE = {
  'echo-evaluation': 'Check how good an Echo is for a Resonator, and how likely it is to reach your Target Score once fully tuned.',
  'upgrade-strategy': 'Try different Upgrade Strategies and compare what they cost.',
};
const tabNow = () => { const h = location.hash.slice(1); return h.startsWith('about') ? 'about' : TABS.some(t => t[0] === h) ? h : 'echo-evaluation'; };
function render() {
  const tab = tabNow(), phone = isPhone();
  document.body.className = `p${P.variant} ${P.theme}${P.embed ? ' embed' : ''}${tab === 'upgrade-strategy' && P.variant === 'C' && phone ? ' has-foot' : ''}`;
  const themeBtn = ibtn(P.theme === 'dark' ? 'sun' : 'moon', P.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme', 'data-act="theme"');
  let pop = '';
  if (P.dlg && tab === 'echo-evaluation' && rowsNow().length) pop = weightsDialog();
  if (P.strat === 'popup' && tab === 'upgrade-strategy' && phone && P.variant !== 'A') pop = substatSheet();
  document.getElementById('app').innerHTML = `<header class="top"><div class="wrap"><div class="brand">Echo Helper</div><nav class="tabs">${TABS.map(([id, l]) => `<a href="#${id}" class="${id === tab ? 'on' : ''}">${l}</a>`).join('')}</nav><div class="hright"><span class="upd">Updated 20 Nov 2026</span>${themeBtn}</div></div></header>
    <div class="wrap">${PURPOSE[tab] ? `<p class="purpose">${PURPOSE[tab]} <a href="#about-${tab === 'echo-evaluation' ? 'evaluating' : 'strategies'}">How it works</a></p>` : ''}
    <main>${tab === 'echo-evaluation' ? echoEvaluation() : tab === 'upgrade-strategy' ? upgradeStrategy() : about()}</main></div>${pop}`;
  const b = (k, v, l) => `<button data-p="${k}" data-v="${v}" class="${String(P[k]) === v ? 'on' : ''}">${l}</button>`;
  document.getElementById('bar').innerHTML = `<button data-cycle="-1">◀</button><b>${P.variant} · ${VARIANTS[P.variant]}</b><button data-cycle="1">▶</button><span class="sep"></span>
    ${tab === 'upgrade-strategy' ? b('strat', 'single', 'One') + b('strat', 'popup', 'Substat popup') + b('strat', 'unfinished', 'Unfinished') + b('strat', 'compare', 'Compare')
      : b('echo', 'empty', 'Empty') + b('echo', 'two', '2/5') + b('echo', 'type', 'Pick type') + b('echo', 'value', 'Pick value') + b('echo', 'full', '5/5') + b('dlg', 'true', 'Weights')}
    <span class="sep"></span>${b('calc', 'true', 'Calculating')}<span class="sep"></span><span>${innerWidth}px</span>`;
  const anchor = location.hash.slice(1); if (anchor.startsWith('about-')) { const el = document.getElementById(anchor); if (el) el.scrollIntoView(); }
}
function setUrl() { const u = new URL(location); u.searchParams.set('variant', P.variant); history.replaceState(null, '', u); }
function cycle(d) { const ks = Object.keys(VARIANTS); P.variant = ks[(ks.indexOf(P.variant) + d + ks.length) % ks.length]; setUrl(); render(); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-cycle]'); if (c) return cycle(+c.dataset.cycle);
  const p = e.target.closest('[data-p]'); if (p) { const k = p.dataset.p, v = p.dataset.v; P[k] = typeof P[k] === 'boolean' ? !P[k] : v; return render(); }
  const sd = e.target.closest('[data-side]'); if (sd) { P.side = sd.dataset.side; return render(); }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'focus') { if (e.target.closest('button, input, select')) { if (!e.target.closest('[data-act="weights"]')) return; } else P.focus = +t.dataset.i; }
  if (act === 'weights' || (act === 'focus' && e.target.closest('[data-act="weights"]'))) P.dlg = true;
  if (act === 'close') { if (t.classList.contains('scrim') || t.classList.contains('sheet-wrap')) { if (e.target !== t) return; } P.dlg = false; if (P.strat === 'popup') P.strat = 'single'; }
  if (act === 'closepop') P.strat = 'single';
  if (act === 'openpop') P.strat = 'popup';
  if (act === 'pick') P.echo = 'type';
  if (act === 'pickval') P.echo = 'value';
  if (act === 'pickback') P.echo = 'type';
  if (act === 'pickdone') P.echo = 'two';
  if (act === 'theme') P.theme = P.theme === 'dark' ? 'light' : 'dark';
  if (act === 'resopen') P.resOpen = !P.resOpen;
  if (act === 'toresults') { e.preventDefault(); document.getElementById('results')?.scrollIntoView({ behavior: 'smooth' }); return; }
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { P.dlg = false; if (P.strat === 'popup') P.strat = 'single'; hideTip(); render(); return; }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
window.addEventListener('hashchange', render);
let lastPhone = isPhone(); window.addEventListener('resize', () => { if (isPhone() !== lastPhone) { lastPhone = isPhone(); render(); } });
// the frame page drives the iframes by message
window.addEventListener('message', e => { if (e.data && e.data.proto16) { Object.assign(P, e.data.state); if (e.data.hash != null && location.hash !== e.data.hash) location.hash = e.data.hash; render(); } });
// tooltips: hover or focus on desktop, tap on a phone; a tap elsewhere closes
const tipbox = document.getElementById('tipbox');
function showTip(el) { tipbox.textContent = el.dataset.tip; tipbox.hidden = false; const r = el.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;
  let x = Math.min(Math.max(10, r.left), innerWidth - w - 10), y = r.bottom + 6; if (y + h > innerHeight - 10) y = r.top - h - 6; tipbox.style.left = x + 'px'; tipbox.style.top = y + 'px'; }
function hideTip() { tipbox.hidden = true; }
document.addEventListener('mouseover', e => { if (e.pointerType === 'touch') return; const t = e.target.closest('.tip'); t ? showTip(t) : (document.activeElement?.classList.contains('tip') ? 0 : hideTip()); });
document.addEventListener('focusin', e => { const t = e.target.closest('.tip'); t ? showTip(t) : hideTip(); });
document.addEventListener('pointerdown', e => { const t = e.target.closest('.tip'); t ? showTip(t) : hideTip(); });
render();
</script>
</body>
</html>
